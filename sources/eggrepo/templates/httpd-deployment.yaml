apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-apache-dpl
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: httpd
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: httpd
  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: httpd
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/httpd-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}
      containers:
      - name: {{ .Release.Name }}-httpd
        image: eeacms/apache:2.4-3.5
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: TZ
          value: "{{ .Values.timezone }}"
        - name: APACHE_CONFIG
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-apache-config-cm
              key: vh-my-app.conf
        volumeMounts:
        {{- if .Values.httpd.serveFiles }}
        - mountPath: /var/local/eggrepo
          name: eggrepo-data
          readOnly: true
        {{- end }}
        {{- if .Values.httpd.cache.enabled }}
        - mountPath: /var/cache/httpd
          name: httpd-cache
        {{- end }}
        resources:
          {{- toYaml .Values.httpd.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.httpd.securityContext | nindent 12 }}

        {{- if (.Values.httpd.livenessProbe) }}
        livenessProbe:
          {{- toYaml .Values.httpd.livenessProbe | nindent 10 }}
        {{- end }}

        {{- with .Values.httpd.startupProbe }}
        {{- $probe := deepCopy . }}
        {{- if and $probe.httpGet (not $probe.httpGet.httpHeaders) }}
        {{- $_ := set $probe.httpGet "httpHeaders" (list (dict "name" "Host" "value" $.Values.url)) }}
        {{- end }}
        startupProbe:
          {{- toYaml $probe | nindent 10 }}
        {{- end }}

        {{- if (.Values.httpd.readinessProbe) }}
        readinessProbe:
          {{- toYaml .Values.httpd.readinessProbe | nindent 10 }}
        {{- end }}

      {{- with .Values.httpd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.httpd.affinity }}
      affinity:
        {{- toYaml .Values.httpd.affinity | nindent 8 }}
      {{- else if .Values.httpd.serveFiles }}
      # the eggrepo volume is ReadWriteOnce, so apache must run on the same node
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                {{- include "appl.selectorLabels" . | nindent 16 }}
                component: eggrepo
            topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.httpd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      volumes:
      {{- if .Values.httpd.serveFiles }}
      - name: eggrepo-data
        persistentVolumeClaim:
          claimName: {{ .Values.httpd.filesClaim | default (printf "eggrepo-data-%s-repo-ss-0" .Release.Name) }}
          readOnly: true
      {{- end }}
      {{- if .Values.httpd.cache.enabled }}
      - name: httpd-cache
        emptyDir:
          sizeLimit: {{ .Values.httpd.cache.sizeLimit }}
      {{- end }}

