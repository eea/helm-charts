apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-repo-ss
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: eggrepo
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-repository
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: eggrepo
  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: eggrepo
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/eggrepo-configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}
      containers:
      - name: {{ .Release.Name }}-repo
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        {{- if .Values.commandArgs }}
        args:
          {{- toYaml .Values.commandArgs | nindent 10 }}
        {{- else if gt (int .Values.eggrepo.processes) 1 }}
        args: ["su-exec", "cluerelmgr", "python", "/opt/eggrepo/server.py", "-p", "9090", "-b", "/var/local/eggrepo/files"]
        {{- end }}
        ports:
        - containerPort: 9090
          protocol: TCP
        env:
        - name: TZ
          value: "{{ .Values.timezone }}"
        - name: EGGREPO_PROCESSES
          value: "{{ .Values.eggrepo.processes }}"
        volumeMounts:
        - mountPath: /var/local/eggrepo
          name: eggrepo-data
        - mountPath: /opt/eggrepo
          name: eggrepo-server
          readOnly: true
        resources:
          {{- toYaml .Values.eggrepo.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.eggrepo.securityContext | nindent 12 }}

        {{- if (.Values.eggrepo.livenessProbe) }}
        livenessProbe:
          {{- toYaml .Values.eggrepo.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.eggrepo.startupProbe) }}
        startupProbe:
          {{- toYaml .Values.eggrepo.startupProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.eggrepo.readinessProbe) }}
        readinessProbe:
          {{- toYaml .Values.eggrepo.readinessProbe | nindent 10 }}
        {{- end }}

      {{- with .Values.eggrepo.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eggrepo.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eggrepo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      volumes:
      - name: eggrepo-server
        configMap:
          name: {{ .Release.Name }}-repo-cm

  volumeClaimTemplates:
  - metadata:
      name: eggrepo-data
    spec:
      accessModes:
      - ReadWriteOnce
      {{- if .Values.storageClassName }}
      storageClass: "{{ .Values.storageClassName }}"
      {{- end }}
      resources:
        requests:
          storage: 10Gi
