# Default values for webforms.

replicaCount: 1

image:
  repository: eeacms/cluereleasemanager
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
timezone: Europe/Copenhagen
ldapServer: ldap.eionet.europa.eu

rewrite:
  url: ''
  tls: yes
  certificate: eggrepo.apps.eea.europa.eu-tls

url: eggrepo.eea.europa.eu

commandArgs: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
  letsencrypt: "01dev-eea-letsencrypt"
  configuration:
    proxy-body-size: "256m"
    proxy-read-timeout: "180s"
    proxy-send-timeout: "120s"
  tls: true
  certificate: ""

eggrepo:
  # Number of forked worker processes; 1 runs the stock single-threaded server
  processes: 8
  resources:
    requests:
      memory: 2Gi
    limits:
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /favicon.ico
      port: 9090
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /favicon.ico
      port: 9090
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 5
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /favicon.ico
      port: 9090
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 4
    successThreshold: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

httpd:
  securityContext: {}
  # Serve /d/<distro>/f/<file> straight from the eggrepo volume instead of the backend
  serveFiles: true
  # PVC with the eggs, defaults to the eggrepo statefulset volume
  filesClaim: ""
  proxyTimeout: 180
  mpm:
    serverLimit: 16
    startServers: 4
    threadsPerChild: 64
    minSpareThreads: 128
    maxSpareThreads: 512
    maxRequestWorkers: 1024
    maxConnectionsPerChild: 10000
  keepAlive:
    maxRequests: 1000
    # longer than the nginx-ingress upstream keepalive (60s), or nginx may reuse
    # a connection apache just closed and return a 502
    timeout: 75
  # Disk cache for the /simple/ index
  cache:
    enabled: true
    # seconds
    expire: 10
    # seconds; how long other requests get the stale copy while one refreshes it,
    # should cover the /simple/ render time
    lockMaxAge: 10
    # bytes; the mod_cache_disk default (1MB) is smaller than the /simple/ page
    maxFileSize: 104857600
    sizeLimit: 1Gi
  resources:
    requests:
      memory: 2Gi
    limits:
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 80
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
    successThreshold: 1
  # Requests /simple/ (with Host set to .Values.url) so the cache is warm
  # before the pod receives traffic
  startupProbe:
    httpGet:
      path: /simple/
      port: 80
    periodSeconds: 5
    timeoutSeconds: 60
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /healthz
      port: 80
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 4
    successThreshold: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}
        
