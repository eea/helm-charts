
apiVersion: v1
kind: Service
metadata:
  name:  {{ .Release.Name }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: eea-query

spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8100
    targetPort: 8100
  selector:
    {{- include "appl.selectorLabels" . | nindent 4 }}
    component: eea-query

