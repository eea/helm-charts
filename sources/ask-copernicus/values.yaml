image:
  repository: eeacms/ask-copernicus-frontend
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

timezone: Europe/Copenhagen

links:
  backend: backend.ask-copernicus

ingress:
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
    nginx.ingress.kubernetes.io/configuration-snippet: |-
      more_set_headers 'Server HTTPS'
        'Strict-Transport-Security max-age=31536000; includeSubDomains; preload'
        "Expect-CT max-age=604800, report-uri='https://sentry.eea.europa.eu/api/45/security/?sentry_key=0343e20fc4e0469790b6016561f032e3'"
        'X-Content-Type-Options nosniff'
        'X-XSS-Protection "1; mode=block"'
        "X-Frame-Options 'SAMEORIGIN'"
        "Referrer-Policy origin"
        'Permissions-Policy accelerometer=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), sync-xhr=(self), usb=()';
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '480'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '120'
  certificate: ask.copernicus.01dev.eea.europa.eu-tls
  tls: enabled

ingressredirects:
  - enabled: false
    tls: true
    certificate: www.plone.eea.europa.eu-tls
    annotations:
      cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
    hostname: www.plone.eea.europa.eu

links:
  backend: backend-varnish.ied

volto:
  serviceType: ClusterIP
  hostname: ask.copernicus.01dev.eea.europa.eu
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  environment:
    INTERNAL_API_PATH: http://backend:8080/VirtualHostBase/https/ask.copernicus.eu:443/Plone/VirtualHostRoot/ask-copernicus
    RAZZLE_INTERNAL_API_PATH: http://backend:8080/VirtualHostBase/https/ask.copernicus.eu:443/Plone/VirtualHostRoot/ask-copernicus
    RAZZLE_API_PATH: https://ask.copernicus.eu
    RAZZLE_PUBLIC_PATH: /
    RAZZLE_BACKEND_NAME: 'eea.docker.plone.clms'
    RAZZLE_IS_ASK_COPERNICUS: "1"
    DEBUG: superagent
    RAZZLE_SENTRY_DSN: ""
    RAZZLE_SENTRY_RELEASE: ""
    RAZZLE_SENTRY_ENVIRONMENT: 01dev
    SENTRY_URL: https://sentry.eea.europa.eu
    SENTRY_AUTH_TOKEN: ""
    SENTRY_ORG: eea
    SENTRY_PROJECT: ask-copernicus-eu
    RAZZLE_MATOMO_SITE_ID: ""
    DANSWER_URL: ""
    DANSWER_API_KEY: ""
    DANSWER_PASSWORD: ""
    DANSWER_USERNAME: ""
    ONYX_URL: ""
    ONYX_API_KEY: ""
    # rag-facts-check (claim verification). Bare origin, no trailing path - the Volto
    # add-on appends /halloumi/generate. With ragFactsCheck.enabled below, the
    # in-cluster value is http://rag-facts-check:8000 and this entry can stay empty.
    # Set it only to point at a checker outside this release. Cluster-internal only:
    # the proxy sends no credential and the service has no auth. Left empty with the
    # service disabled, the add-on falls back to http://localhost:8000 and
    # fact-checks fail with "Fact-checker unavailable".
    RAG_FACT_CHECKER_URL: ""
    CSP_HEADER: >-
      default-src 'none';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      manifest-src 'self'
      media-src https://ask.copernicus.eu/;
      connect-src 'self' https://webanalytics.europa.eu https://*.eea.europa.eu https://europa.eu https://geocode.arcgis.com https://api.openaire.eu https://api.zotero.org;
      font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com https://*.eea.europa.eu;
      frame-src 'self' https://europa.eu https://*.europa.eu https://*.eea.europa.eu https://eea.maps.arcgis.com;
      img-src https: blob: data:;
      script-src 'self' {nonce} blob: https://webanalytics.europa.eu https://matomo.eea.europa.eu https://europa.eu https://www.google.com https://www.gstatic.com https://spreadsheets.google.com https://docs.google.com https://*.eea.europa.eu https://d3js.org https://cdnjs.cloudflare.com https://code.jquery.com https://services.arcgis.com https://public.tableau.com;
      style-src 'self' 'unsafe-inline'  https://www.google.com https://europa.eu https://fonts.googleapis.com https://ajax.googleapis.com https://www.gstatic.com https://*.eea.europa.eu https://cdnjs.cloudflare.com https://code.jquery.com;
      frame-ancestors 'self' https://*.eea.europa.eu;
      report-to csp-endpoint;
      report-uri https://sentry.eea.europa.eu/api/45/security/?sentry_key=0343e20fc4e0469790b6016561f032e3;
  annotations: {}
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1

ragFactsCheck:
  # Claim verification for the chatbot. The Volto add-on (volto-eea-chatbot) posts
  # /_ha/generate to the Volto SSR proxy, which forwards it here. One instance per
  # release; the service is cluster-internal and has no auth.
  # NOTE: this release's image must ship @eeacms/volto-eea-chatbot >= 4.0.0, which
  # is the version whose /_ha proxy reads RAG_FACT_CHECKER_URL. Older images still
  # talk to the LLM gateway directly and ignore this service.
  enabled: true
  image:
    repository: eeacms/rag-facts-check
    pullPolicy: Always
    tag: "v1.2"
  replicaCount: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 512Mi
  environment:
    # OpenAI-compatible base URL of the LLM gateway (llm-toolkit / LiteLLM). The
    # checker appends no path of its own, so include /v1.
    LLM_API_BASE: "https://llmgw.eea.europa.eu/v1"
    # Never commit a key. Empty here, supplied per environment (Rancher form or
    # --set); the deployment template skips empty values, so nothing is rendered.
    LLM_API_KEY: ""
    # Model alias served by the gateway, not the upstream model id - see
    # llm-toolkit's edenai deployment (model: edenai/openai/gpt-mini-latest).
    LLM_MODEL: "edenai"
    LLM_TEMPERATURE: "0.1"
    LLM_MAX_TOKENS: "1024"
    # Seconds per judge call. Varnish sits in front of Volto with
    # first_byte_timeout=300s, so keep the whole request well under that.
    LLM_TIMEOUT: "120"
    # 1 turns chain-of-thought off, roughly halving judge latency on reasoning
    # models. Endpoint-specific variants go in LLM_EXTRA_BODY.
    LLM_DISABLE_REASONING: "1"
    # Raw JSON merged into every request; wins over LLM_DISABLE_REASONING on
    # conflicting keys. Empty = unused.
    LLM_EXTRA_BODY: ""
    # Evidence budget in characters. A document that fits inside MAX_DOCS_CHARS is
    # passed whole; MAX_CHARS_PER_DOC only applies when the corpus overflows the
    # total, so one huge source cannot starve the others. Matches the code defaults.
    CHECKER_MAX_DOCS_CHARS: "100000"
    CHECKER_MAX_CHARS_PER_DOC: "10000"
    # Only the Volto SSR proxy calls this service, server-side, so no browser origin
    # is required. Empty keeps the server's own default (allow all).
    CORS_ORIGINS: ""
  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 15
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    initialDelaySeconds: 15
    failureThreshold: 4
    successThreshold: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 3000

varnish:
  serviceType: ClusterIP
  serviceName: frontend-varnish
  port: 3000
  backend: "frontend-volto"
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []

affinity: {}

debug:
  serviceType: ClusterIP
  enabled: false
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  environment: {}
  environment:
    VARNISH_SIZE: '2G'
    VARNISH_DNS_TTL: '20s'
    VARNISH_BERESP_TTL: '60s' 
    VARNISH_BERESP_GRACE: '120s'
    VARNISH_BERESP_KEEP: '120s'
    VARNISH_GZIP_ENABLED: 'false'
    VARNISH_GZIP_JSON_ENABLED: 'false' 
    AUTOKILL_CRON: ''
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
