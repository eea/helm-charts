apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-config
data:
  default.conf: |
    # Real IP handling (Docker/K8s)
    set_real_ip_from 172.17.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # --- Logging ---
    # Access log with total + upstream timings (seconds)
    log_format graylog_strict_timed
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log graylog_strict_timed;

    server {
        listen {{ .Values.matomo.environment.NGINX_HTTP_PORT_NUMBER }};
        server_name _;

        client_body_timeout 1800s;
        client_header_timeout 1800s;
        keepalive_timeout 1800s;
        send_timeout 1800s;

        root /var/www/html;
        index index.php;

        # NOTE: regex locations are evaluated in order, first match wins.

        # Only these PHP entry points are executed (as in matomo-org/matomo-nginx)
        location ~ ^/(index|matomo|piwik|js/index|plugins/HeatmapSessionRecording/configs)\.php$ {
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            fastcgi_read_timeout 1800s;
            fastcgi_send_timeout 1800s;
            fastcgi_connect_timeout 1800s;
        }

        # Deny every other PHP file
        location ~* \.php$ {
            deny all;
            return 403;
        }

        location ~ ^/(config|tmp|core|lang|console|tests)(/|$) {
            deny all;
            return 403;
        }

        location ~ /\.ht {
            deny all;
            return 403;
        }

        location ~* \.mmdb$ {
            deny all;
            return 403;
        }

        # Root markdown files (README.md, PRIVACY.md, SECURITY.md)
        location ~* ^/[^/]+\.md$ {
            deny all;
            return 403;
        }


        # Static assets - must stay BEFORE the libs|vendor|plugins|misc|node_modules
        # deny, so plugin assets and misc/user logos keep loading
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|htm|html|ttf|eot|woff|woff2|mp3|mp4|wav|ogg|avi)$ {
            expires max;
            log_not_found off;
        }

        # Deny everything else in these directories
        location ~ ^/(libs|vendor|plugins|misc|node_modules)(/|$) {
            deny all;
            return 403;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }
    }
