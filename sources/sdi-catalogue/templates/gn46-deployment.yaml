{{- if .Values.gn5.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gn46
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: gn46

spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: gn46
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: gn46
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}
      {{- with .Values.gn46.tmpdir }}
      {{- /* The init container deletes old files in this directory, so only accept a subdirectory of /var/local/gis_sdi/tmp/ */}}
      {{- if or (not (regexMatch "^/var/local/gis_sdi/tmp/[A-Za-z0-9][A-Za-z0-9._/-]*$" .)) (contains ".." .) }}
      {{- fail "gn46.tmpdir must be a subdirectory of /var/local/gis_sdi/tmp/ (letters, digits, . _ - / only, no ..)" }}
      {{- end }}
      initContainers:
      # Creates the temp directory on the gis-sdi volume, it must exist before the JVM starts.
      # Also deletes files older than a day left by pods that were killed (strategy is Recreate,
      # so the previous pod is gone). It prints what it finds and deletes (see the init-tmpdir logs),
      # and a cleanup error never blocks the start.
      - name: init-tmpdir
        image: {{ $.Values.gn46.image | default "eeacms/eea-geonetwork:eea-4.9.x-b4bb7fce" }}
        command:
        - sh
        - -c
        - |
          dir={{ . }}
          mkdir -p "$dir" || exit 1
          echo "init-tmpdir: using $dir"
          df -h "$dir" | tail -n 1 | sed 's/^/init-tmpdir: volume: /'
          echo "init-tmpdir: before cleanup: $(find "$dir" -mindepth 1 | wc -l) entries, $(du -sh "$dir" | cut -f1)"
          echo "init-tmpdir: deleting entries older than a day:"
          find "$dir" -mindepth 1 -mtime +1 -print -delete || echo "init-tmpdir: cleanup reported errors, ignoring them"
          echo "init-tmpdir: after cleanup: $(find "$dir" -mindepth 1 | wc -l) entries, $(du -sh "$dir" | cut -f1)"
        volumeMounts:
        - mountPath: /var/local/gis_sdi
          name: gis-sdi
      {{- end }}
      containers:
      - name: gn46
        image: {{ .Values.gn46.image | default "eeacms/eea-geonetwork:eea-4.9.x-b4bb7fce" }}
        env:
        - name: WEBAPP_CONTEXT_PATH
          value: {{ .Values.gn46.webapp_context }}
        - name: geonetwork_dir
          value: {{ .Values.gn46.geonetwork_dir }}
        - name: CATALOGUE
          value: {{ .Values.gn46.catalogue_name }}
        - name: JAVA_OPTS
          # The image entrypoint only passes JAVA_OPTS and GN_CONFIG_PROPERTIES to the JVM (JAVA_OPTIONS is overwritten)
          value: "-Djava.security.egd=file:/dev/./urandom -Djava.awt.headless=true -Xms512M -Xss512M -Xmx2G -XX:+UseConcMarkSweepGC -Dorg.eclipse.jetty.server.Request.maxFormContentSize={{ .Values.gn46.jetty_max_form_content_size | int64 }} -Dorg.eclipse.jetty.server.Request.maxFormKeys={{ .Values.gn46.jetty_max_form_keys | int64 }}"
        {{- with .Values.gn46.tmpdir }}
        # JAVA_OPTS does not work for java.io.tmpdir in this image (Jetty takes it as a start property),
        # JAVA_TOOL_OPTIONS is read by the JVM itself
        - name: JAVA_TOOL_OPTIONS
          value: "-Djava.io.tmpdir={{ . }}"
        {{- end }}
        - name: GN_CONFIG_PROPERTIES
          value: "-Dgeonetwork.security.type={{ .Values.gn46.security_type }} -Dgeonetwork.dir={{ .Values.gn46.geonetwork_dir }} -Dgeonetwork.data.dir={{ .Values.gn46.geonetwork_data_dir }} -Dgeonetwork.db.type={{ .Values.gn46.db_type }} -Dgeonetwork.schema.dir={{ .Values.gn46.schema_dir }} -Dgeonetwork.formatter.dir={{ tpl .Values.gn46.formatter_dir . }} -Dgeonetwork.indexConfig.dir={{ .Values.gn46.index_config_dir }} -Dgeonetwork.resources.dir={{ tpl .Values.gn46.resources_dir . }} -Des.host={{ .Values.gn46.es_host }} -Des.port={{ .Values.gn46.es_port }} -Des.protocol={{ .Values.gn46.es_protocol }} -Des.index.records={{ .Values.gn46.es_index_records }} -Des.url={{ tpl .Values.gn46.es_url . }} -Dgeonetwork.ESFeaturesProxy.targetUri={{ tpl .Values.gn46.es_features_proxy .}} -Dkb.url=http://kibana:5601 -Dgeonetwork.HttpDashboardProxy.targetUri={{ .Values.gn46.dashboardproxy_targeturi }} -Dapi.params.maxUploadSize={{ .Values.gn46.max_upload_size | int64 }}"
        {{- if .Values.gn46.opendal.enabled }}
        # Store record attachments and thumbnails with OpenDAL instead of the data directory
        - name: GEONETWORK_STORE_TYPE
          value: opendal
        - name: OPENDAL_SCHEME
          value: {{ .Values.gn46.opendal.scheme | quote }}
        - name: OPENDAL_ROOT
          value: {{ .Values.gn46.opendal.root | quote }}
        {{- with .Values.gn46.opendal.presignExpirySeconds }}
        - name: OPENDAL_PRESIGN_EXPIRY_SECONDS
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.gn46.opendal.bucket }}
        - name: OPENDAL_BUCKET
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.gn46.opendal.region }}
        - name: OPENDAL_REGION
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.gn46.opendal.endpoint }}
        - name: OPENDAL_ENDPOINT
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.gn46.opendal.existingSecret }}
        - name: OPENDAL_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: access-key-id
        - name: OPENDAL_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ . }}
              key: secret-access-key
        {{- end }}
        {{- end }}
        # To configure the database connection parameters fill the values in /catalogue-data/config/db.properties
        # To configure the LDAP connection options fill the values in /catalogue-data/config/security.properties

        # Liveness probe checks if the application is healthy and restarts the container if it fails
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: {{ .Values.gn46.webapp_context }}/srv/eng/catalog.search
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        
        # Startup probe checks if the application has started successfully before running liveness/readiness probes
        startupProbe:
          failureThreshold: 30
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 5

        ports:
        - containerPort: 8080
        resources:
          {{- toYaml .Values.gn46.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /catalogue-data
          name: sdi-gn5-data
        - mountPath: /var/local/gis_sdi
          name: gis-sdi
          readOnly: false
        - mountPath: /catalogue-data/config/security.properties
          name: sdi-gn46-config
          readOnly: true
          subPath: security.properties
        

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always

      volumes:
      - name: sdi-gn5-data
        persistentVolumeClaim:
          claimName: sdi-gn5-data
      - name: gis-sdi
        persistentVolumeClaim:
          claimName: gis-sdi
          readOnly: false
      - name: sdi-gn46-config
        configMap:
          defaultMode: 0444
          optional: false
          name: sdi-gn46-config
{{- end }}