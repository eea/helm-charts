apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-geonetwork-initdb

data:
  # Runs once, only when postgres-geonetwork starts against an empty data
  # directory. geonetworkdb's own database/role are created automatically by
  # the postgres image itself from POSTGRES_DB/POSTGRES_USER; this script only
  # adds the second database Nextcloud needs on the same instance.
  nextcloud-db.sql: |
    CREATE DATABASE "{{ .Values.nextclouddb.database }}";
    CREATE USER "{{ .Values.nextclouddb.user }}" WITH ENCRYPTED PASSWORD '{{ .Values.nextclouddb.password }}';
    GRANT ALL PRIVILEGES ON DATABASE "{{ .Values.nextclouddb.database }}" TO "{{ .Values.nextclouddb.user }}";
