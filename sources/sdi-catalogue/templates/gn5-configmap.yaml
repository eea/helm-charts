apiVersion: v1
kind: ConfigMap
metadata:
  name: sdi-gn5-config

data:
  gn5-config.yaml: |
    server:
      port: {{ .Values.gn5.server.port }}
      servlet:
        context-path: {{ .Values.gn5.webapp_context }}

    geonetwork:
      url: https://{{ .Values.serverName }}
      url_with_context: https://{{ .Values.serverName }}/{{ .Values.gn5.webapp_context }}
      4:
        url: http://gn46:8080/{{ .Values.gn46.webapp_context }}
      index:
        url: {{ .Values.gn5.index.protocol }}://{{ .Values.gn5.index.host }}:{{ .Values.gn5.index.port }}
        indexRecordName: {{ .Values.gn5.index.indexRecordName }}

      proxy:
        enabled: {{ .Values.gn5.proxy.enabled | default false }}

      directory:
        data: {{ .Values.gn5.geonetwork_data_dir }}
        metadata:
          layout: UUID
          privileges: NONE

      openapi:
        url: https://{{ .Values.serverName }}
        
      security:
        provider: {{ .Values.gn5.security.provider | default "none" }}
        createdUser:
          group: {{ .Values.gn5.security.createdUser.group | quote }}
          {{- if .Values.gn5.security.createdUser.profile }}
          profile: {{ .Values.gn5.security.createdUser.profile | quote }}
          {{- end }}
        {{- if eq (.Values.gn5.security.provider | default "none") "ldap" }}
        # Enabled if provider is ldap
        ldap:
          # Empty url uses the embedded LDAP server
          url: {{ .Values.gn5.security.ldap.url | quote }}
          base: {{ .Values.gn5.security.ldap.base | quote }}
          user-search-dn: {{ .Values.gn5.security.ldap.userSearchDn | quote }}
          user-search-filter: {{ .Values.gn5.security.ldap.userSearchFilter | quote }}
          attributes:
            username: {{ .Values.gn5.security.ldap.attributes.username | quote }}
            email: {{ .Values.gn5.security.ldap.attributes.email | quote }}
            name: {{ .Values.gn5.security.ldap.attributes.name | quote }}
            surname: {{ .Values.gn5.security.ldap.attributes.surname | quote }}
        {{- end }}

    {{- if .Values.gn5.oauth2.enabled }}

    spring:
      security:
        oauth2:
          client:
            registration:
              eea:
                client-id: {{ .Values.gn5.oauth2.clientId }}
                client-secret: ${OAUTH2_CLIENT_SECRET}
                scope: {{ .Values.gn5.oauth2.scopes }}
                {{- if .Values.gn5.oauth2.redirectUri }}
                redirect-uri: {{ .Values.gn5.oauth2.redirectUri }}
                {{- else }}
                redirect-uri: https://{{ .Values.serverName }}{{ .Values.gn5.webapp_context }}/login/oauth2/code/eea
                {{- end }}
                authorization-grant-type: authorization_code
                client-name: EEA MS Entra ID
            provider:
              eea:
                issuer-uri: {{ .Values.gn5.oauth2.issuerUri }}
                user-name-attribute: {{ .Values.gn5.oauth2.userNameAttribute }}
      servlet:
        multipart:
          max-file-size: {{ .Values.gn5.maxFileSize }}
    {{- else }}

    spring:
      security:
        oauth2:
          client:
            registration: {}
            provider: {}
      servlet:
        multipart:
          max-file-size: {{ .Values.gn5.maxFileSize }}
    {{- end }}


 