{{- if .Values.datahub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datahub
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: datahub

spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: datahub

  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: datahub
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}
      containers:
      - name: datahub
        image: {{ required "datahub.image is required when datahub.enabled is true" .Values.datahub.image }}
        env:
        # Same host as the UI, so the GN5 context path is enough
        - name: GEONETWORK_API_URL
          value: {{ .Values.gn5.webapp_context | quote }}
        ports:
        - containerPort: 8080
        resources:
          {{- toYaml .Values.datahub.resources | nindent 10 }}

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 30
          failureThreshold: 3

      restartPolicy: Always
{{- end }}
