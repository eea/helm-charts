{{- if not .Values.existingSecret }}
# Credentials from values, kept out of the pod spec. Not rendered when
# existingSecret is set (then that Secret must hold the same keys).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appl.envSecretName" . }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.plone.database.POSTGRES_PASSWORD | quote }}
  {{- range $key := .Values.secretEnvKeys }}
  {{- with index ($.Values.plone.environment | default dict) $key }}
  {{ $key }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
