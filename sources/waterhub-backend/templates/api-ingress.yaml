apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waterhub-api
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: waterhub-api
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{- with .Values.ingress.securityHeaders }}
      {{- . | nindent 6 }}
      {{- end }}
      if ($uri = "/++api++/@email-send") {
        return 403;
      }

      if ($uri = "/++api++/@email-notification") {
        return 403;
      }

      rewrite ^/(\+\+api\+\+)(.*)$ /VirtualHostBase/https/{{ .Values.plone.hostname }}:443/{{ .Values.plone.site }}/$1/VirtualHostRoot$2 break;
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    {{- with .Values.ingress.rateLimit.api }}
    nginx.ingress.kubernetes.io/limit-rps: {{ . | quote }}
    {{- end }}
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.plone.hostname }}
    http:
      paths:
      - path: /\+\+api\+\+(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.varnish.serviceName }}
            port:
              number: {{ .Values.varnish.port }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.plone.hostname }}
    {{- if .Values.ingress.certificate }}
    secretName: {{ .Values.ingress.certificate }}
    {{- end  }}
  {{- end  }}
