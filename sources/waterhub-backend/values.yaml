image:
  repository: eeacms/waterhub-backend
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

# Credentials are loaded with envFrom into the plone, debug, zodbpack and entrasync containers from a
# Secret, never written into the pod spec.
# - existingSecret empty: the chart renders "<release>-secrets" from values:
#   POSTGRES_PASSWORD (from plone.database.POSTGRES_PASSWORD) and the plone.environment keys listed in secretEnvKeys.
# - existingSecret set: that Secret (managed outside the chart) is used instead
#   and must contain the same keys; the values above are then ignored.
existingSecret: ""
secretEnvKeys:
  - SENTRY_DSN
  - PLONE_REGISTRY_YAML_CONTENT

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

networkPolicy:
  # Ingress-only NetworkPolicies for varnish and the app pods. Set to false to roll back.
  enabled: true
  # Peer allowed to reach varnish: the cluster ingress controller (RKE2 default).
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        app.kubernetes.io/name: rke2-ingress-nginx

timezone: Europe/Copenhagen

# Leave empty when plone-postgres is in the same namespace (it creates the
# "postgres" and "memcached" services). Set to <service>.<namespace> to
# create ExternalName services pointing to another namespace.
links:
  database: ""
  memcached: ""

ingress:
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
  certificate: plone.eea.europa.eu-tls
  tls: enabled
  # Added to the api, admin and google ingresses (HSTS comes from the ingress controller).
  securityHeaders: |
    more_set_headers 'X-Content-Type-Options nosniff'
      'X-Frame-Options SAMEORIGIN'
      'Referrer-Policy strict-origin-when-cross-origin';
  # Requests per second per client IP (nginx allows bursts of 5x). Empty disables.
  rateLimit:
    api: "20"
    admin: "5"
  # Comma-separated CIDRs allowed to reach /admin. Empty allows all (Basic Auth still applies).
  adminSourceRange: ""

nginx:
  basicAuth:
    username: eeaploneadmin
    password: ""
    # /admin (Plone classic) is only exposed when password or existingSecret is set
    # Existing Secret with an htpasswd "auth" key; overrides username/password
    existingSecret: ""

plone:
  serviceType: ClusterIP
  hostname: plone.eea.europa.eu
  googleUrl: ""
  site: waterhub
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    # targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 60
  replicaCount: 1
  # Image entrypoint already drops to uid 500; run as it from the start.
  securityContext:
    runAsNonRoot: true
    runAsUser: 500
    runAsGroup: 500
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  database:
    POSTGRES_DB: database
    POSTGRES_USER: databaseuser
    POSTGRES_PASSWORD: databasepassword
  environment:
    GRAYLOG: "logcentral.eea.europa.eu:12201"
    SENTRY_DSN: ""
    SENTRY_ENVIRONMENT: "01dev"
    CORS_ALLOW_ORIGIN: ""
    DEFAULT_PUBLISHER: ""
    DEFAULT_ORGANISATIONS: ""
    STATIC_BANNER_ENABLED_waterhub: ""
    DYNAMIC_BANNER_ENABLED: ""
    PLONE_REGISTRY_YAML_CONTENT: ""
  annotations: {}
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 4
    successThreshold: 2

varnish:
  serviceType: ClusterIP
  serviceName: backend-varnish
  backend: "backend-plone"
  port: 8080
  # varnishd master needs root to set up its jail, so no runAsNonRoot / capability drop here.
  securityContext:
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  environment:
    VARNISH_SIZE: 2G
    VARNISH_DNS_TTL: "20s"
    VARNISH_BERESP_TTL: "60s"
    VARNISH_BERESP_GRACE: "120s"
    VARNISH_BERESP_KEEP: "120s"
    VARNISH_GZIP_ENABLED: "false"
    VARNISH_GZIP_JSON_ENABLED: "false"
    AUTOKILL_CRON: ""
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1

debug:
  serviceType: ClusterIP
  enabled: false
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  environment: {}

entrasync:
  enabled: false
  schedule: "0 0 3 * *"
  activeDeadlineSeconds: 36000
  keepSuccessfulPods: 3
  keepFailedPods: 5
  resources:
    limits:
      cpu: 2
      memory: 1Gi
    requests:
      cpu: 1
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

zodbpack:
  enabled: false
  schedule: "0 0 3 * *"
  keepSuccessfulPods: 3
  keepFailedPods: 5
  resources:
    limits:
      cpu: 2
      memory: 1Gi
    requests:
      cpu: 1
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

postfix:
  fullnameOverride: ""
  dryrun: false
  serverName: plone.eea.europa.eu
  mtpPass: ""
  mtpPort: ""
  mtpRelay: ""
  mtpUser: ""
  serviceName: "postfix"
  mailtrap:
    httpenabled: false
    serviceType: ClusterIP
    ingress:
      enabled: false
      hostname: mailtrap.01dev.eea.europa.eu
      annotations:
        cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
      certificate: mailtrap.01dev.eea.europa.eu-tls
