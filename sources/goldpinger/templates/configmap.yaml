apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gp.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gp.labels" . | nindent 4 }}
data:
  zap.json: |-
    {"level":"info","encoding":"json","outputPaths":["stdout"],"errorOutputPaths":["stderr"],"encoderConfig":{"messageKey":"message","levelKey":"level","levelEncoder":"lowercase","timeKey":"ts","timeEncoder":"ISO8601","callerKey":"caller","callerEncoder":"Short"}}
