{{- if or .Values.goldpinger.graphOnly .Values.goldpinger.targetLabels }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gp.fullname" . }}-graph-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gp.labels" . | nindent 4 }}
data:
  index.html: |-
    {{- include "gp.uiHtml" . | nindent 4 }}
{{- end }}
