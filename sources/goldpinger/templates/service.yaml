apiVersion: v1
kind: Service
metadata:
  name: {{ include "gp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gp.labels" . | nindent 4 }}
    goldpinger_job: {{ include "gp.fullname" . | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "gp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
