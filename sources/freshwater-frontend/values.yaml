image:
  repository: eeacms/freshwater-frontend
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

timezone: Europe/Copenhagen

landing:
  enabled: false

ingress:
  certificate: dev-wise.01dev.eea.europa.eu-tls
  tls: true
  path: /freshwater
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
    nginx.ingress.kubernetes.io/configuration-snippet: |-
      more_set_headers 'Server HTTPS'
        'Strict-Transport-Security max-age=31536000; includeSubDomains; preload'
        "Expect-CT max-age=604800, report-uri='https://sentry.eea.europa.eu/api/62/security/?sentry_key=524cdf94d5f24d2da6f89cd25a07bf9a'"
        'X-Content-Type-Options nosniff'
        'X-XSS-Protection "1; mode=block"'
        "X-Frame-Options 'SAMEORIGIN'"
        "Referrer-Policy origin"
        "Content-Security-Policy default-src 'none'; manifest-src 'self'; object-src 'self'; base-uri 'self'; form-action 'self'; connect-src 'self' https://*.ec.europa.eu https://*.arcgis.com/ https://*.arcgisonline.com/ https://api.openaire.eu https://api.openaire.com https://api.zotero.org/ https://*.eea.europa.eu/ https://*.eionet.europa.eu; font-src 'self' data: https://cdnjs.cloudflare.com/ https://fonts.gstatic.com/ https://*.eea.europa.eu https://*.eionet.europa.eu https://*.arcgis.com/; frame-src 'self' https://flo.uri.sh/ https://europa.eu/ https://*.europa.eu/ https://*.eionet.europa.eu https://*.arcgis.com/; img-src https: blob: data:; script-src 'self' 'unsafe-inline' https://public.tableau.com https://api.openaire.eu https://api.openaire.com https://api.zotero.org/ https://matomo.eea.europa.eu https://*.eea.europa.eu/ https://*.arcgis.com https://www.google.com/jsapi https://www.google.com/uds/ https://www.gstatic.com/ https://spreadsheets.google.com/ https://docs.google.com/ https://*.eionet.europa.eu https://d3js.org https://cdnjs.cloudflare.com https://code.jquery.com; frame-ancestors 'self' *.eionet.europa.eu *.eea.europa.eu; style-src 'self' 'unsafe-inline' https://www.google.com/uds/ https://api.openaire.eu https://api.openaire.com https://api.zotero.org/ https://*.googleapis.com/css https://*.eea.europa.eu/ https://*.arcgis.com/ https://www.gstatic.com/ https://*.eionet.europa.eu https://*.eea.europa.eu https://cdnjs.cloudflare.com https://code.jquery.com; report-uri https://sentry.eea.europa.eu/api/45/security/?sentry_key=0343e20fc4e0469790b6016561f032e3"
        "Permissions-Policy accelerometer=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), sync-xhr=(self 'https://js.arcgis.com' 'https://maps.eea.europa.eu'), usb=()";
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "480"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

ingressredirects:
  - enabled: false
    certificate: www.plone.eea.europa.eu-tls
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
    hostname: www.plone.eea.europa.eu

links:
  backend: backend-varnish.wise-freshwater

volto:
  serviceType: NodePort
  hostname: dev-wise.01dev.eea.europa.eu
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetMemoryUtilizationPercentage: 60
  replicaCount: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  environment:
    SENTRY_URL:
    SENTRY_AUTH_TOKEN:
    SENTRY_ORG:
    SENTRY_PROJECT:
    RAZZLE_SENTRY_DSN:
    RAZZLE_BACKEND_NAME: "freshwater-backend"
    RAZZLE_ALLOWED_CORS_DESTINATIONS:
    RAZZLE_MATOMO_URL:
    RAZZLE_MATOMO_SITE_ID:
    RAZZLE_MATOMO_SECOND_SITE_ID:
    RAZZLE_MATOMO_SECOND_TRACKER_URL:
    RAZZLE_INTERNAL_API_PATH: "http://backend:8080/VirtualHostBase/https/water.europa.eu:443/Plone/VirtualHostRoot/_vh_freshwater"
    RAZZLE_API_PATH: "https://dev-wise.01dev.eea.europa.eu/freshwater"
    RAZZLE_PREFIX_PATH: "/freshwater"
    RAZZLE_PUBLIC_URL: ""
    RAZZLE_DEMO_SITE:
    RAZZLE_BANNER_HEADER:
    RAZZLE_BANNER_MESSAGE:
    RAZZLE_FRONTEND_VERSION:
    PROXY_ES_DSN_globalsearch:
    PROXY_QA_DSN_globalsearch:
    PROXY_ES_DSN_freshwatermeasure:
    PROXY_QA_DSN_freshwatermeasure: "http://nlp_internal.ai-lab-aws.eea.europa.eu:9200/api"
    RAZZLE_ES_INDEX: "_es/freshwatermeasure"
    RAZZLE_ES_INDEX_NAME: "data_searchui"
    RAZZLE_PROXY_ES_DSN: ""
    VOLTO_ROBOTSTXT:
    RAZZLE_DISABLE_DRAFT_WATERMARK:
    DANSWER_URL: ""
    DANSWER_API_KEY: ""
    LLMGW_TOKEN: ""
    LLMGW_URL: ""
    CSP_HEADER: "default-src 'none'; base-uri 'self'; script-src 'self' {nonce} https://public.tableau.com https://*.discomap.eea.europa.eu https://api.openaire.eu https://api.openaire.com https://api.zotero.org https://taskman.eionet.europa.eu https://matomo.eea.europa.eu https://openlayers.org https://js.arcgis.com https://geocode.arcgis.com https://services.arcgis.com https://*.eea.europa.eu; style-src 'self' 'unsafe-inline' https://api.openaire.eu https://*.discomap.eea.europa.eu https://api.openaire.com https://api.zotero.org https://taskman.eionet.europa.eu https://openlayers.org https://js.arcgis.com https://*.eea.europa.eu; img-src 'self' https: data: blob:; font-src 'self' data: https://js.arcgis.com https://*.eea.europa.eu; frame-src 'self' https://*.europa.eu https://europa.eu https://*.discomap.eea.europa.eu https://*.eea.europa.eu; connect-src 'self' https://*.arcgis.com https://*.arcgisonline.com https://*.discomap.eea.europa.eu https://api.openaire.eu https://api.openaire.com https://api.zotero.org https://taskman.eionet.europa.eu https://api.friendlycaptcha.com/api/v1/ https://*.openstreetmap.org https://*.eea.europa.eu https://*.ec.europa.eu; form-action 'self' https://*.eea.europa.eu; frame-ancestors 'self' https://biodiversity.europa.eu https://*.eea.europa.eu; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests; report-uri https://sentry.eea.europa.eu/api/22/security/?sentry_key=c2d7a7ca8deb46909d3bfc1bd468eb3d"
    ONYX_URL: ""
    ONYX_API_KEY: ""
    # rag-facts-check (claim verification). Bare origin, no trailing path - the Volto
    # add-on appends /halloumi/generate. With ragFactsCheck.enabled below, the
    # in-cluster value is http://rag-facts-check:8000 and this entry can stay empty.
    # Set it only to point at a checker outside this release. Cluster-internal only:
    # the proxy sends no credential and the service has no auth. Left empty with the
    # service disabled, the add-on falls back to http://localhost:8000 and
    # fact-checks fail with "Fact-checker unavailable".
    RAG_FACT_CHECKER_URL: ""
  annotations: {}
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 4
    successThreshold: 2

ragFactsCheck:
  # Claim verification for the chatbot. The Volto add-on (volto-eea-chatbot) posts
  # /_ha/generate to the Volto SSR proxy, which forwards it here. One instance per
  # release; the service is cluster-internal and has no auth.
  enabled: true
  image:
    repository: eeacms/rag-facts-check
    pullPolicy: Always
    tag: "v1.2"
  replicaCount: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 512Mi
  environment:
    # OpenAI-compatible base URL of the LLM gateway (llm-toolkit / LiteLLM). The
    # checker appends no path of its own, so include /v1.
    LLM_API_BASE: "https://llmgw.eea.europa.eu/v1"
    # Never commit a key. Empty here, supplied per environment (Rancher form or
    # --set); the deployment template skips empty values, so nothing is rendered.
    LLM_API_KEY: ""
    # Model alias served by the gateway, not the upstream model id - see
    # llm-toolkit's edenai deployment (model: edenai/openai/gpt-mini-latest).
    LLM_MODEL: "edenai"
    LLM_TEMPERATURE: "0.1"
    LLM_MAX_TOKENS: "1024"
    # Seconds per judge call. Varnish sits in front of Volto with
    # first_byte_timeout=300s, so keep the whole request well under that.
    LLM_TIMEOUT: "120"
    # 1 turns chain-of-thought off, roughly halving judge latency on reasoning
    # models. Endpoint-specific variants go in LLM_EXTRA_BODY.
    LLM_DISABLE_REASONING: "1"
    # Raw JSON merged into every request; wins over LLM_DISABLE_REASONING on
    # conflicting keys. Empty = unused.
    LLM_EXTRA_BODY: ""
    # Evidence budget in characters. A document that fits inside MAX_DOCS_CHARS is
    # passed whole; MAX_CHARS_PER_DOC only applies when the corpus overflows the
    # total, so one huge source cannot starve the others. Matches the code defaults.
    CHECKER_MAX_DOCS_CHARS: "100000"
    CHECKER_MAX_CHARS_PER_DOC: "10000"
    # Only the Volto SSR proxy calls this service, server-side, so no browser origin
    # is required. Empty keeps the server's own default (allow all).
    CORS_ORIGINS: ""
  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 15
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    initialDelaySeconds: 15
    failureThreshold: 4
    successThreshold: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

debug:
  addonsPath: /app/src/addons
  affinity: {}
  enabled: false
  environment: {}
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext: {}
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 3Gi
  securityContext: {}
  serviceType: NodePort
  tolerations: []

varnish:
  serviceType: NodePort
  serviceName: frontend-varnish
  port: 3000
  backend: "frontend-volto"
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 3Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  environment:
    VARNISH_SIZE: "2G"
    VARNISH_DNS_TTL: "20s"
    VARNISH_BERESP_TTL: "60s"
    VARNISH_BERESP_GRACE: "120s"
    VARNISH_BERESP_KEEP: "120s"
    VARNISH_GZIP_ENABLED: "false"
    VARNISH_GZIP_JSON_ENABLED: "false"
    AUTOKILL_CRON: ""
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
