image:
  repository: eeacms/cachet
  pullPolicy: Always
  # Cachet v3 image; empty uses the chart appVersion
  tag: "3"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

timezone: Europe/Copenhagen

ingress:
  enabled: true
  className: "appsec-nginx"
  annotations: {}
  restrictedAnnotations: 
    nginx.ingress.kubernetes.io/whitelist-source-range: |
      192.168.60.0/22,
      192.168.64.0/21,
      10.92.24.0/21,
      10.50.0.0/16,
      10.20.30.0/24,
      10.0.9.0/24,
      10.50.7.57  
  productionEnvironment: false
  letsencrypt: "01dev-eea-letsencrypt"
  configuration:
    proxy-body-size: "256m"
    proxy-read-timeout: "180s"
    proxy-send-timeout: "120s"
    configuration-snippet: >-
      more_set_headers "Server: HTTPS";

      more_set_headers "Strict-Transport-Security: max-age=31536000;
      includeSubDomains; preload";

      more_set_headers "X-Content-Type-Options: nosniff";

      more_set_headers "X-XSS-Protection: 1; mode=block";

      more_set_headers "X-Frame-Options: SAMEORIGIN";

      more_set_headers "Referrer-Policy: origin";

      more_set_headers "Content-Security-Policy: default-src 'self'; script-src
      'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com
      https://matomo.eea.europa.eu; style-src 'self' 'unsafe-inline'
      https://fonts.googleapis.com; font-src 'self' data:
      https://fonts.gstatic.com; img-src 'self' data: https://www.gravatar.com; connect-src 'self'
      https://matomo.eea.europa.eu; frame-src 'self'; object-src 'none';
      base-uri 'self'; frame-ancestors 'self';";

      more_set_headers "Permissions-Policy: accelerometer=(), autoplay=(),
      camera=(), encrypted-media=(), fullscreen=(self), geolocation=(),
      gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(),
      picture-in-picture=(), sync-xhr=(self), usb=()";
  # make sure to add ; at the end of the snippet
  tls: true
  certificate: ""
  enableRestictions: true 
  restrictedClassName: "appsec-nginx" 
   
postgres:
  # PostgreSQL 17 starts on a new volume; see the README for upgrading from 9.6
  image: eeacms/postgres:17s
  pullPolicy: IfNotPresent
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  environment:
    POSTGRES_DBNAME: cachet
    POSTGRES_DBUSER: cachet
    POSTGRES_DBPASS: postgres  
    POSTGRES_PASSWORD: password
    POSTGRES_CONFIG: |
      max_connections = 150
    POSTGRES_CRONS: |
      ##
    POSTGRES_REPLICATION_NETWORK:
  datastorage:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      memory: 2Gi
    limits:
      memory: 2Gi
  livenessProbe:
    tcpSocket:
      port: 5432
    periodSeconds: 10
    timeoutSeconds: 3
  startupProbe:
    tcpSocket:
      port: 5432
    failureThreshold: 10
    periodSeconds: 5
    initialDelaySeconds: 5
    timeoutSeconds: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

postfix:
  fullnameOverride: ''
  dryrun: false
  serverName: status.eea.europa.eu
  mtpPass: ''
  mtpPort: ''
  mtpRelay: ''
  mtpUser: ''
  serviceName: 'postfix'
  mailtrap:
    httpenabled: false
    serviceType: NodePort
    ingress:
      enabled: false
      hostname: mailtrap.01dev.eea.europa.eu
      annotations:
        cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
      certificate: mailtrap.01dev.eea.europa.eu-tls
  
cachet:
  # set to 0 while restoring the database during the v2 -> v3 upgrade (see README)
  replicaCount: 1
  serviceType: ClusterIP
  serviceName: cachet-svc
  hostname: status.01dev.eea.europa.eu
  resources:
    requests:
      memory: 2Gi
    limits:
      memory: 2Gi
  environment:
    DB_PREFIX: "chq_"
    APP_KEY: "base64:4t9MvAAFSKd7jIdCSAGV/NwXRTrafJeKUU9QqLrK+Zk="
    LOG_CHANNEL: "stderr"
    DEBUG: "false"
    MAIL_NAME: "EEA Systems Status"
    MAIL_ADDRESS: "noreply@eea.europa.eu"
    TIMEOUT: "180"
    # php-fpm workers; each one can hold a database connection (max_connections = 150)
    PHP_MAX_CHILDREN: "20"
    PHP_MAX_EXECUTION_TIME: "300"

  livenessProbe:
    httpGet:
      path: /up
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  # the first start after the v2 -> v3 upgrade runs the database migrations
  startupProbe:
    httpGet:
      path: /up
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 120

  terminationGracePeriodSeconds: 70
  # the image runs as uid 1001, group 0: make the uploads volume writable for group 0
  podSecurityContext:
    fsGroup: 0

  # uploads volume (status page banner, ...)
  datastorage:
    size: 1Gi
    storageClassName: ""
    accessModes: "ReadWriteMany"



    
monitor:
  enabled: false
  image:
    repository: eeacms/cachet-monitor
    # Cachet v3 API support
    tag: "3"
  environment:
    # Cachet v3: an API key from Dashboard -> API Keys
    CACHET_TOKEN: ""
    CACHET_DEV: ""
    CONFIG: |
      checks:
        - name: "Cachet Web"
          type: http
          url: https://status-dev.eea.europa.eu
          component_id: 1
          interval: 60

        - name: "PostgreSQL"
          type: tcp
          host: postgres
          port: 5432
          component_id: 2
          interval: 60
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 256Mi
