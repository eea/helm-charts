apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dpl-cachet
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: cachet
spec:
  # "default" would turn 0 into 1; 0 is used while restoring the database
  replicas: {{ hasKey .Values.cachet "replicaCount" | ternary .Values.cachet.replicaCount 1 }}
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: cachet
  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: cachet
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}
      # the queue worker gets 60s to finish a running job (supervisord stopwaitsecs)
      terminationGracePeriodSeconds: {{ .Values.cachet.terminationGracePeriodSeconds | default 70 }}
      {{- with .Values.cachet.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: cachet
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        ports:
          - name: http
            containerPort: 8000
        env:
          - name: DB_DRIVER
            value: "pgsql"
          - name: DB_HOST
            value: "postgres"
          - name: DB_PORT
            value: "5432"
          - name: DB_DATABASE
            value: "{{ .Values.postgres.environment.POSTGRES_DBNAME }}"
          - name: DB_USERNAME
            value: "{{ .Values.postgres.environment.POSTGRES_DBUSER }}"
          - name: DB_PASSWORD
            value: "{{ .Values.postgres.environment.POSTGRES_DBPASS }}"

          - name: APP_URL
          {{- if .Values.ingress.tls }}
            value: "https://{{ .Values.cachet.hostname }}"
          {{- else }}
            value: "http://{{ .Values.cachet.hostname }}"
          {{- end }}
            

          - name: MAIL_HOST
            value: "postfix"
          - name: MAIL_PORT
            value: "25"
          - name: MAIL_DRIVER
            value: "smtp"
          - name: MAIL_ENCRYPTION
            value: ""
          - name: TZ
            value: "{{ .Values.timezone }}"
          - name: CACHET_BEACON
            value: "false"

          {{- range $key, $val := .Values.cachet.environment }}
          - name: {{ $key }}
            value: {{ $val | quote }}
          {{- end }}

        {{- if .Values.cachet.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.cachet.livenessProbe | nindent 12 }}
        {{- end }}

        {{- if .Values.cachet.startupProbe }}
        startupProbe:
          {{- toYaml .Values.cachet.startupProbe | nindent 12 }}
        {{- end }}

        resources:
          {{- toYaml .Values.cachet.resources | nindent 12 }}

        # uploaded files (status page banner, ...)
        volumeMounts:
          - name: uploads
            mountPath: /var/www/html/storage/app/public
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-cachet-uploads

