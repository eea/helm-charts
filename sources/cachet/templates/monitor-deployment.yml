{{- if .Values.monitor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dpl-monitor
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: cachet-monitor
spec:
  replicas: {{ .Values.monitor.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: cachet-monitor
  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: cachet-monitor
    spec:
      containers:
        - name: cachet-monitor
          {{- $image := .Values.monitor.image | default dict }}
          image: "{{ $image.repository | default "eeacms/cachet-monitor" }}:{{ $image.tag | default "3" }}"
          env:
            - name: CACHET_API
              {{- if .Values.ingress.tls }}
              value: "https://{{ .Values.cachet.hostname }}/api"
              {{- else }}
              value: "http://{{ .Values.cachet.hostname }}/api"
              {{- end }}
            - name: TZ
              value: "{{ .Values.timezone }}"
            {{- if .Values.monitor.environment }}
            {{- range $key, $val := .Values.monitor.environment }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.monitor.resources.requests.memory }}
            limits:
              memory: {{ .Values.monitor.resources.limits.memory }}

{{- end }}                
