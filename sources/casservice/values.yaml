replicaCount: 1

image:
  repository: eeacms/casserver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: "sso.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ""
      hosts:
        - "sso.example.com"

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}

# When CAS is launched without values, it will generate keys and write them
# to standard out. You then copy paste them into your overrides file.
cas:
  server:
    name: https://sso.example.com
    prefix: https://sso.example.com/cas
  adminPagesSecurity:
    ip: 127\.0\.0\.1
  shibAttributeResolver:
    resources: file:/etc/cas/config/attribute-resolver.xml

  tgc:
    encryptionKey: ''
    signingKey: ''

  webflow:
    signing:
      key: ''
      keySize: ''
    encryption:
      key: ''
      keySize: ''
    alg: AES


