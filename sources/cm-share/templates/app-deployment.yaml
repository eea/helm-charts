apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: app

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: app
  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: app
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"

        env:
        - name: MYSQL_DATABASE
          value: {{ .Values.db.database }}
        - name: MYSQL_PASSWORD
          value: {{ .Values.db.password }}
        - name: MYSQL_USER
          value: {{ .Values.db.user }}
        - name: MYSQL_HOST
          value: db
        - name: REDIS_HOST
          value: redis
        - name: TZ
          value: Europe/Copenhagen

        ports:
        - containerPort: 9000

        resources:
          {{- toYaml .Values.app.resources | nindent 10 }}

        volumeMounts:
        - mountPath: /var/www/html
          name: cmshare-app-data
        - mountPath: /data
          name: {{ .Values.pvcNames.cmshareData }}

        {{- if (.Values.app.livenessProbe) }}
        livenessProbe:
          {{- toYaml .Values.app.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.app.startupProbe) }}
        {{- $startupProbe := deepCopy .Values.app.startupProbe }}
        {{- if and (hasKey $startupProbe "tcpSocket") (hasKey $startupProbe "httpGet") }}
        {{- $_ := unset $startupProbe "httpGet" }}
        {{- end }}
        startupProbe:
          {{- toYaml $startupProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.app.readinessProbe) }}
        {{- $readinessProbe := deepCopy .Values.app.readinessProbe }}
        {{- if and (hasKey $readinessProbe "tcpSocket") (hasKey $readinessProbe "httpGet") }}
        {{- $_ := unset $readinessProbe "httpGet" }}
        {{- end }}
        readinessProbe:
          {{- toYaml $readinessProbe | nindent 10 }}
        {{- end }}


        securityContext:
          {{- toYaml .Values.app.securityContext | nindent 10 }}

      restartPolicy: Always

      volumes:
      - name: cmshare-app-data
        persistentVolumeClaim:
          claimName: cmshare-app-data
      - name: {{ .Values.pvcNames.cmshareData }}
        persistentVolumeClaim:
          claimName: {{ .Values.pvcNames.cmshareData }}
