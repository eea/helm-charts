image:
  repository: nextcloud
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resolver: "10.43.0.10"
timezone: Europe/Copenhagen

serviceAccount:
  create: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

nginx:
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 3Gi
  service:
    type: ClusterIP
  livenessProbe:
    failureThreshold: 5
    httpGet:
      httpHeaders:
        - name: Host
          value: cmshare.02pre.eea.europa.eu
      path: /status.php
      port: 80
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  startupProbe:
    failureThreshold: 60
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 80
    timeoutSeconds: 3



cron:
  securityContext:
    privileged: false
  resources:
    requests:
      memory: 4Gi
    limits:
      memory: 4Gi

app:
  securityContext:
    privileged: false
  resources:
    requests:
      memory: 4Gi
    limits:
      memory: 4Gi
  livenessProbe:
    failureThreshold: 5
    periodSeconds: 5
    successThreshold: 1
    tcpSocket:
      port: 9000
    timeoutSeconds: 3
  startupProbe:
    failureThreshold: 60
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 9000
    timeoutSeconds: 3



postfix:
  fullnameOverride: "postfix"
  serverName: ""
  mtpPass: ""
  mtpPort: ""
  mtpRelay: ""
  mtpUser: ""

db:
  database: ncdb
  user: ""
  password: ""
  rootPW: ""
  resources:
    requests:
      memory: 5Gi
    limits:
      memory: 5Gi
  storage: 4Gi

redis:
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 4Gi

cmshareData:
  existing: false

pvcNames:
  cmshareDBdata: "cmshare-db-data"
  cmshareData: "cmshare-data"
