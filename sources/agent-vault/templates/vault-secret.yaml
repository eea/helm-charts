apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-vault.vault.fullname" . }}
  labels:
    {{- include "agent-vault.labels" . | nindent 4 }}
    component: vault
type: Opaque
stringData:
  AGENT_VAULT_MASTER_PASSWORD: {{ required "agentVault.masterPassword is required" .Values.agentVault.masterPassword | quote }}
  {{- if .Values.agentVault.database.enabled }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.auth.username (required "postgres.auth.password is required when postgres.enabled is true" .Values.postgres.auth.password) (include "agent-vault.postgres.fullname" .) .Values.postgres.auth.database | quote }}
  {{- else if not .Values.agentVault.database.existingSecret }}
  DATABASE_URL: {{ required "agentVault.database.url is required when agentVault.database.enabled is true, postgres.enabled is false, and agentVault.database.existingSecret is unset" .Values.agentVault.database.url | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.smtp.enabled .Values.smtp.password (not .Values.smtp.existingSecret) }}
  AGENT_VAULT_SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
