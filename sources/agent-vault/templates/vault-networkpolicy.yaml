{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-vault.vault.fullname" . }}
  labels:
    {{- include "agent-vault.labels" . | nindent 4 }}
    component: vault
spec:
  podSelector:
    matchLabels:
      {{- include "agent-vault.vault.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Management UI/API and MITM proxy: reachable from any pod in the
    # namespace — the nginx-proxy pods for browser access to the UI, and
    # agent workloads directly for both the control API (token
    # validation/discovery, e.g. `agent-vault run`) and the MITM proxy
    # itself. Never routed to by the public Ingress (which only targets the
    # proxy Service), so this stays unreachable from outside the cluster.
    - from:
        - podSelector: {}
      ports:
        - port: ui
          protocol: TCP
        - port: mitm
          protocol: TCP
    {{- if .Values.mitmService.enabled }}
    # External access via the mitmService LoadBalancer (vault-mitm-service.yaml).
    # That Service uses externalTrafficPolicy: Local, so the real client IP
    # reaches the pod — matched here the same way the LoadBalancer's own
    # loadBalancerSourceRanges already restricts it, as defense in depth.
    - from:
        {{- range .Values.mitmService.loadBalancerSourceRanges }}
        - ipBlock:
            cidr: {{ if contains "/" . }}{{ . }}{{ else }}{{ . }}/32{{ end }}
        {{- end }}
      ports:
        - port: mitm
          protocol: TCP
    {{- end }}
{{- end }}
