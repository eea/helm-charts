{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-vault.vault.fullname" . }}
  labels:
    {{- include "agent-vault.labels" . | nindent 4 }}
    component: vault
spec:
  podSelector:
    matchLabels:
      {{- include "agent-vault.vault.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Management UI/API: only the nginx-proxy pods may reach it — this is
    # what keeps a leaked HTTPS_PROXY value useless from outside the cluster.
    - from:
        - podSelector:
            matchLabels:
              {{- include "agent-vault.proxy.selectorLabels" . | nindent 14 }}
      ports:
        - port: ui
          protocol: TCP
    # MITM proxy: reachable from any pod in the namespace (agent workloads
    # call through it), but never routed to by the public Ingress.
    - from:
        - podSelector: {}
      ports:
        - port: mitm
          protocol: TCP
{{- end }}
