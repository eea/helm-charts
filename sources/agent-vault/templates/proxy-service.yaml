apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-vault.proxy.fullname" . }}
  labels:
    {{- include "agent-vault.labels" . | nindent 4 }}
    component: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  selector:
    {{- include "agent-vault.proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.proxy.port }}
      targetPort: http
      protocol: TCP
