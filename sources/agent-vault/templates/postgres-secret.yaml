{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-vault.postgres.fullname" . }}
  labels:
    {{- include "agent-vault.labels" . | nindent 4 }}
    component: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required when postgres.enabled is true" .Values.postgres.auth.password | quote }}
{{- end }}
