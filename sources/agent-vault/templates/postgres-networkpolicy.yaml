{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-vault.postgres.fullname" . }}
  labels:
    {{- include "agent-vault.labels" . | nindent 4 }}
    component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "agent-vault.postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agent-vault.vault.selectorLabels" . | nindent 14 }}
      ports:
        - port: postgres
          protocol: TCP
{{- end }}
