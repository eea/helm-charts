categories:
  - Database
  - Logging
  - Elasticsearch

questions:
  - variable: "clusterName"
    type: "string"
    required: true
    label: "Cluster name"
    description: "Name of the Elasticsearch Cluster"
    default: "es-cluster"
    group: "Elasticsearch Configuration"


  - variable: "securityEnabled"
    label: "Enable Network Security"
    description: |
      Set true to add network security policies
    default: false
    required: true
    type: boolean
    group: "Security Configuration"


  - variable: "useMonitoring"
    label: "Enable ElasticSearch monitoring"
    description: |
      Set true to use the monitoring X-Pack module  - https://www.elastic.co/what-is/open-x-pack.
      You will need kibana and X-PACK to be installed.
    default: false
    required: true
    type: boolean
    group: "Elasticsearch Configuration"

  - variable: "updateSysctl"
    label: "Update host sysctl:"
    description: |
      Set true to avoid vm.max_map_count errors. ES will not start without vm.max_map_count updated.
      WARN: If set true, host param vm.max_map_count will be update to 262144.
    default: false
    required: true
    type: boolean
    group: "Elasticsearch Configuration"

  - variable: "bootstrapMemoryLock"
    label: "Enable bootstrap memory lock:"
    description: |
      Enable memory locking for Elasticsearch. In most Kubernetes environments, this should be false.
      Only enable if your cluster supports memory locking and you need maximum performance.
    default: false
    required: true
    type: boolean
    group: "Elasticsearch Configuration"

  - variable: "podDisruptionBudget.enabled"
    label: "Enable Pod Disruption Budgets"
    description: |
      Enable Pod Disruption Budgets to ensure minimum availability during cluster maintenance.
      Recommended for production environments to prevent too many Elasticsearch pods being unavailable simultaneously.
    default: true
    required: true
    type: boolean
    group: "Elasticsearch Configuration"

  - variable: "kibana.enabled"
    label: "Add kibana container:"
    description: |
      Set true to add a Kibana container.
      If false, Kibana will not be added.
    default: true
    required: true
    type: boolean
    group: "Kibana Configuration"

  - variable: "kibana.url"
    description: "Public facing URL for Kibana (without / at the end). Leave empty to auto-generate from ingress configuration."
    label: "Kibana URL (Optional)"
    type: "string"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.ingress.enabled"
    label: "Enable kibana ingress"
    default: true
    type: "boolean"
    required: true
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.ingress.tls"
    label: "Kibana Enable https"
    default: true
    type: "boolean"
    required: true
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true&&kibana.ingress.enabled"

  - variable: "kibana.ingress.letsencrypt"
    label: "Kibana Ingress letsencrypt cluster-issuer"
    description: "Leave empty when not using letsencrypt"
    default: "01dev-eea-letsencrypt"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true&&kibana.ingress.enabled&&kibana.ingress.tls"

  - variable: "kibana.ingress.certificate"
    label: "Kibana Certificate name"
    description: "Leave blank for default certificate, hostname-tls for letsencrypt"
    default: "kibana.01dev.eea.europa.eu-tls"
    type: "string"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true&&kibana.ingress.enabled&&kibana.ingress.tls"

  - variable: "kibana.ingress.configuration.proxy-body-size"
    label: "Kibana Rancher LB body size"
    description: "Example 100m"
    type: "string"
    default: "100m"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true&&kibana.ingress.enabled"
  
  - variable: "kibana.ingress.configuration.proxy-read-timeout"
    label: "Kibana Rancher LB read timeout"
    description: "Maximum response time from upstream server, in seconds, example 60s"
    type: "string"
    default: "120s"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true&&kibana.ingress.enabled"


  - variable: "kibana.ingress.configuration.proxy-send-timeout"
    label: "Kibana Rancher LB send timeout"
    description: "Timeout before closing the connection"
    type: "string"
    default: "60s"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true&&kibana.ingress.enabled"
    
  - variable: "kibana.ingress.restrictFromInternet"
    label: "Kibana Restict internet access"
    description: "If checked, will not be available from the internet, only inside the network"
    default: true
    type: "boolean"
    required: true
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true&&kibana.ingress.enabled"


  - variable: "kibana.spaceSize"
    type: "string"
    required: true
    label: "Heap size kibana"
    description: "Used for NodeJs --max-old-space-size setting"
    default: "1024"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.resources.requests.memory"
    type: "string"
    required: true
    label: "Memory reservation for kibana container"
    description: "AT LEAST the heap size!"
    default: "1024m"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.resources.limits.memory"
    type: "string"
    required: true
    label: "Memory limit for kibana container"
    description: "AT LEAST double the heap size!"
    default: "2048m"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.autocompleteTimeout"
    label: "Kibana autocomplete timeout"
    type: string
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.autocompleteTerminateAfter"
    label: "Kibana autocomplete terminate after"
    type: string
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.requestTimeout"
    label: "Kibana elasticsearch timeout"
    type: string
    default: "300000"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.service.type"
    label: "Kibana service type"
    description: "Choose NodePort if you don't want to use ingress to connect to kibana"
    type: "enum"
    options:
      - "NodePort"
      - "ClusterIP"
    required: true
    default: "ClusterIP"
    group: "Kibana Configuration"
    show_if: "kibana.enabled=true"




  - variable: "masterHeapSize"
    type: "string"
    required: true
    label: "Heap size (master nodes)"
    description: "Heap size to be allocated for Java (master nodes)"
    default: "512m"
    group: "Master Nodes"

  - variable: "esmaster.resources.requests.memory"
    type: "string"
    required: true
    label: "Memory reservation (master node)"
    description: "Memory reservation per elasticsearch container. Recommended - triple the heap size! (master nodes)"
    default: "1536m"
    group: "Master Nodes"

  - variable: "esmaster.resources.limits.memory"
    type: "string"
    required: true
    label: "Memory limit (master node)"
    description: "Memory limit per elasticsearch container. Recommended - triple the heap size! (master nodes)"
    default: "1536m"
    group: "Master Nodes"


  - variable: "dataHeapSize"
    type: "string"
    required: true
    label: "Heap size (data nodes)"
    description: "Heap size to be allocated for Java (data nodes)"
    default: "512m"
    group: "Data Nodes"

  - variable: "esworker.resources.requests.memory"
    type: "string"
    required: true
    label: "Memory reservation (data nodes)"
    description: "Memory reservation per elasticsearch container. Recommended - triple the heap size! (master nodes)"
    default: "1536m"
    group: "Data Nodes"

  - variable: "esworker.resources.limits.memory"
    type: "string"
    required: true
    label: "Memory limit (data nodes)"
    description: "Memory limit per elasticsearch container.  Recommended - triple the heap size! (data nodes)"
    default: "1536m"
    group: "Data Nodes"


  - variable: "cerebro.enabled"
    label: "Add cerebro container:"
    description: |
      Set true to add a Cerebro container.
      If false, Kibana will not be added.
    default: true
    required: true
    type: boolean
    group: "Cerebro Configuration"


  - variable: "cerebro.resources.limits.memory"
    type: "string"
    required: true
    label: "Memory limit for cerebro container"
    description: "AT LEAST double the heap size!"
    default: "512m"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled"

  - variable: "cerebro.resources.requests.memory"
    type: "string"
    required: true
    label: "Memory reservation for cerebro container"
    description: "AT LEAST double the heap size!"
    default: "512m"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled"


  - variable: "cerebro.user"
    label: "Cerebro username"
    description: "Leave blank for no authentification, not recommended"
    type: "string"
    default: "admin"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled"

  - variable: "cerebro.password"
    label: "Cerebro password"
    type: "password"
    default: "secret"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled"

  - variable: "cerebro.secret"
    label: "Cerebro secret"
    description: "Used in cookies, generate it with `pwgen  -y 64  | head -n 1` or `openssl rand -base64 32`. Will be randomly generated if not given"
    type: "string"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled"

  - variable: "cerebro.service.type"
    label: "Cerebro service type"
    description: "Choose NodePort if you don't want to use ingress to connect to cerebro"
    type: "enum"
    options:
      - "NodePort"
      - "ClusterIP"
    required: true
    default: "ClusterIP"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true"

  - variable: "cerebro.url"
    description: "Public facing URL for Cerebro"
    label: "Cerebro URL (Optional)"
    type: "string"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true"

  - variable: "cerebro.ingress.enabled"
    label: "Enable cerebro ingress"
    default: true
    type: "boolean"
    required: true
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true"

  - variable: "cerebro.ingress.tls"
    label: "Cerebro Enable https"
    default: true
    type: "boolean"
    required: true
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true&&cerebro.ingress.enabled"

  - variable: "cerebro.ingress.letsencrypt"
    label: "Cerebro Ingress letsencrypt cluster-issuer"
    description: "Leave empty when not using letsencrypt"
    default: "01dev-eea-letsencrypt"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true&&cerebro.ingress.enabled&&cerebro.ingress.tls"

  - variable: "cerebro.ingress.certificate"
    label: "Cerebro Certificate name"
    description: "Leave blank for default certificate, hostname-tls for letsencrypt"
    default: "cerebro.01dev.eea.europa.eu-tls"
    type: "string"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true&&cerebro.ingress.enabled&&cerebro.ingress.tls"

  - variable: "cerebro.ingress.configuration.proxy-body-size"
    label: "Cerebro Rancher LB body size"
    description: "Example 100m"
    type: "string"
    default: "100m"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true&&cerebro.ingress.enabled"

  - variable: "cerebro.ingress.configuration.proxy-read-timeout"
    label: "Cerebro Rancher LB read timeout"
    description: "Maximum response time from upstream server, in seconds, example 60s"
    type: "string"
    default: "120s"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true&&cerebro.ingress.enabled"


  - variable: "cerebro.ingress.configuration.proxy-send-timeout"
    label: "Cerebro Rancher LB send timeout"
    description: "Timeout before closing the connection"
    type: "string"
    default: "60s"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true&&cerebro.ingress.enabled"

  - variable: "cerebro.ingress.restrictFromInternet"
    label: "Cerebro Restict internet access"
    description: "If checked, will not be available from the internet, only inside the network"
    default: true
    type: "boolean"
    required: true
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true&&cerebro.ingress.enabled"




  - variable: "esmaster.password"
    label: "Superuser ( elastic ) password"
    description: "Empty for no authentification, minimum 6 characters"
    type: "password"
    group: "Security Configuration"

  - variable: "kibana.password"
    description: "Minumum 6 characters, needs Superuser password to not be empty"
    label: "kibana user password (kibana_system)"
    type: "password"
    group: "Security Configuration"
    show_if: "kibana.enabled=true"
    

  - variable: "kibana.allowAnonRo"
    label: "Allow anonymous readonly access to kibana:"
    description: |
      Will be used if there is a Kibana container and 
      Elasticsearch is secured with passwords
    default: true
    required: true
    type: boolean
    group: "Security Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.anonPassword"
    description: "Minumum 6 characters, if given will be used to configure anonymous access to elasticsearch"
    label: "Anonymous user password (used in background)"
    default: "RandomPassword1"
    type: "password"
    group: "Security Configuration"
    show_if: "kibana.enabled=true"

  - variable: "kibana.readOnlyRoleJson"
    description: "Default is empty, will use the value from the kibana image, examples of json - https://www.elastic.co/guide/en/kibana/current/role-management-api-put.html"
    label: "Kibana guest user permission configuration"
    type: "string"
    group: "Security Configuration"
    show_if: "kibana.enabled=true"



  - variable: "backup.enabled"
    label: "Enabled backup volume"
    description: "Volume to save snapshots, empty if no backup necessary"
    default: false
    required: true
    type: boolean
    group: "Storage configuration"


  - variable: "backup.size"
    label: "Backup volum size"
    default: "100Gi"
    type: "string"
    group: "Storage configuration"
    show_if: "backup.enabled"  

  - variable: "backup.storageClassName"
    label: "Backup storage class name"
    default: "nfs-client"
    type: "string"
    required: true
    group: "Storage configuration"
    show_if: "backup.enabled" 
      
  - variable: "esmaster.persistence.size"
    label: "Master volume size"
    default: "10Gi"
    type: "string"
    required: true
    group: "Storage configuration"

  - variable: "esmaster.persistence.storageClassName"
    label: "Master volume class name"
    default: "nfs-rancher"
    type: "string"
    required: true
    group: "Storage configuration"

  - variable: "esworker.persistence.size"
    label: "Data volume size"
    default: "10Gi"
    type: "string"
    required: true
    group: "Storage configuration"

  - variable: "esworker.persistence.storageClassName"
    label: "Data volume class name"
    default: "nfs-rancher"
    type: "string"
    required: true
    group: "Storage configuration"
      


  - variable: "cerebro.service.type"
    label: "Cerebro service type"
    description: "Choose NodePort if you don't want to use ingress to connect to cerebro"
    type: "enum"
    options:
      - "NodePort"
      - "ClusterIP"
    required: true
    default: "ClusterIP"
    group: "Cerebro Configuration"
    show_if: "cerebro.enabled=true"


  - variable: "esmaster.clientService.enabled"
    label: "Enable Master service 9200"
    default: true
    type: "boolean"
    required: true
    group: "Elasticsearch Configuration"

  - variable: "esmaster.clientService.type"
    label: "Elastic Master 9200 service type"
    description: "Choose NodePort to expose the port"
    type: "enum"
    options:
      - "NodePort"
      - "ClusterIP"
    required: true
    default: "ClusterIP"
    group: "Elasticsearch Configuration"
    show_if: "esmaster.clientService.enabled=true"
    
  - variable: "esmaster.clientService.allowAccesFromOutside"
    label: "Enable Master service 9200 outside access"
    default: false
    type: "boolean"
    required: true
    show_if: "esmaster.clientService.enabled=true"
    group: "Elasticsearch Configuration"


  - variable: "esworker.url"
    description: "Public facing URL for ElasticSearch"
    label: "ElasticSearch URL (Optional)"
    type: "string"
    group: "ElasticSearch Configuration"

  - variable: "esworker.ingress.enabled"
    label: "Enable Elasticsearch ingress"
    default: true
    type: "boolean"
    required: true
    group: "ElasticSearch Configuration"

  - variable: "esworker.ingress.tls"
    label: "Enable https on ElasticSearch ingress"
    default: true
    type: "boolean"
    required: true
    group: "ElasticSearch Configuration"
    show_if: "esworker.ingress.enabled"

  - variable: "esworker.ingress.letsencrypt"
    label: "ElasticSearch Ingress letsencrypt cluster-issuer"
    description: "Leave empty when not using letsencrypt"
    default: "01dev-eea-letsencrypt"
    group: "ElasticSearch Configuration"
    show_if: "esworker.ingress.enabled&&esworker.ingress.tls"

  - variable: "esworker.ingress.certificate"
    label: "ElasticSearch Certificate name"
    description: "Leave blank for default certificate, hostname-tls for letsencrypt"
    default: "elasticsearch.01dev.eea.europa.eu-tls"
    type: "string"
    group: "ElasticSearch Configuration"
    show_if: "esworker.ingress.enabled&&esworker.ingress.tls"

  - variable: "esworker.ingress.configuration.proxy-body-size"
    label: "ElasticSearch Rancher LB body size"
    description: "Example 100m"
    type: "string"
    default: "100m"
    group: "ElasticSearch Configuration"
    show_if: "esworker.ingress.enabled"

  - variable: "esworker.ingress.configuration.proxy-read-timeout"
    label: "ElasticSearch Rancher LB read timeout"
    description: "Maximum response time from upstream server, in seconds, example 60s"
    type: "string"
    default: "120s"
    group: "ElasticSearch Configuration"
    show_if: "esworker.ingress.enabled"


  - variable: "esworker.ingress.configuration.proxy-send-timeout"
    label: "ElasticSearch Rancher LB send timeout"
    description: "Timeout before closing the connection"
    type: "string"
    default: "60s"
    group: "ElasticSearch Configuration"
    show_if: "esworker.ingress.enabled"

  - variable: "esworker.ingress.restrictFromInternet"
    label: "ElasticSearch Restict internet access"
    description: "If checked, will not be available from the internet, only inside the network"
    default: true
    type: "boolean"
    required: true
    group: "ElasticSearch Configuration"
    show_if: "esworker.ingress.enabled"







