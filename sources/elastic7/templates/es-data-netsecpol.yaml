{{- if ( default .Values.securityEnabled true) -}}
{{- if .Values.esworker.ingress.enabled }}
{{/*
  Any http port needs access to if from ingress or if you want to test it with a Node Port
*/}}



apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-http-allow-9200
  labels:
    {{- include "appl.labels" . | nindent 4 }}


spec:
  podSelector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: data 

  policyTypes:
  - Ingress
  ingress:
    - ports:
        - port: 9200
          protocol: TCP

{{- end }}
{{- end }}
