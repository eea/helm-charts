{{- if ( default .Values.securityEnabled true) -}}

{{-  if .Values.cerebro.enabled -}}

{{/*
  Any http port needs access to if from ingress or if you want to test it with a Node Port
*/}}


apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-http-allow-cerebro
  labels:
    {{- include "appl.labels" . | nindent 4 }}


spec:
  podSelector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: cerebro


  policyTypes:
  - Ingress
  ingress:
    - ports:
        - port: 9000
          protocol: TCP
{{- end }}

{{- end }}
