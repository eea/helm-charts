{{- if .Values.cronjobs.zodbpack.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cronjob-zodbpack
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: zodbpack
spec:
  schedule: {{ .Values.cronjobs.zodbpack.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjobs.zodbpack.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.cronjobs.zodbpack.successfulJobsHistoryLimit | default 1 }}
  failedJobsHistoryLimit: {{ .Values.cronjobs.zodbpack.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjobs.zodbpack.backoffLimit | default 1 }}
      activeDeadlineSeconds: {{ .Values.cronjobs.zodbpack.activeDeadlineSeconds | default 36000 }}
      template:
        metadata:
          labels:
            {{- include "appl.selectorLabels" . | nindent 12 }}
            component: zodbpack
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "appl.serviceAccountName" . }}
          restartPolicy: Never
          containers:
          - name: zodbpack
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            args:
            - /app/bin/zodbpack
            - /app/etc/zodbpack.conf
            env:
            - name: SERVER_NAME
              value: "{{ .Values.plone.hostname }}"
            - name: SENTRY_SITE
              value: "{{ .Values.plone.hostname }}"
            - name: GRAYLOG_FACILITY
              value: "{{ .Values.plone.hostname }}"
            - name: BACKEND_VERSION
              value: "{{ .Values.image.tag | default .Chart.AppVersion }}"
            - name: SENTRY_RELEASE
              value: "{{ .Values.image.tag | default .Chart.AppVersion }}"
            - name: TZ
              value: "{{ .Values.timezone }}"
            - name: RELSTORAGE_DSN
              value: "host='postgres' dbname='{{ .Values.plone.database.POSTGRES_DB }}' user='{{ .Values.plone.database.POSTGRES_USER }}' password='{{ .Values.plone.database.POSTGRES_PASSWORD }}'"
            {{- range $key, $value := .Values.plone.environment }}
            {{- if ($value) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            resources:
              {{- toYaml .Values.cronjobs.zodbpack.resources | nindent 14 }}
{{- end }}
