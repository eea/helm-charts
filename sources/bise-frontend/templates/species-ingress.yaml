{{- if .Values.speciesFilter.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: species-gatekeeper
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: species-gatekeeper
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://species-gatekeeper.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.speciesFilter.port }}/"
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '480'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '120'
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.volto.hostname }}
    http:
      paths:
      {{- range .Values.speciesFilter.filters }}
      - path: {{ .path }}
        pathType: Prefix
        backend:
          service:
            name: {{ $.Values.varnish.serviceName }}
            port:
              number: {{ $.Values.varnish.port }}
      {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.volto.hostname }}
    {{- if .Values.ingress.certificate }}
    secretName: {{ .Values.ingress.certificate }}
    {{- end }}
  {{- end }}
{{- end }}
