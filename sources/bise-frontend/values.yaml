

image:
  repository: eeacms/bise-frontend
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

timezone: Europe/Copenhagen


ingress:
  certificate: dev-biodiversity-tls
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
    nginx.ingress.kubernetes.io/configuration-snippet: |-
      rewrite ^/habitats/annex(.*)$ /habitats/ANNEX$1 redirect;
      rewrite ^/habitats_eunis_revised/eunisrev(.*)$ /habitats_eunis_revised/EUNISrev$1 redirect;
      rewrite ^/habitats_res4/eunis2012(.*)$ /habitats_res4/EUNIS2012$1 redirect;
      rewrite ^/habitats_rl/redlist(.*)$ /habitats_rl/REDLIST$1 redirect;
      more_set_headers 'Server HTTPS'
        'Strict-Transport-Security max-age=31536000; includeSubDomains; preload'
        "Expect-CT max-age=604800, report-uri='https://sentry.eea.europa.eu/api/45/security/?sentry_key=0343e20fc4e0469790b6016561f032e3'"
        'X-Content-Type-Options nosniff'
        'X-XSS-Protection 1; mode=block'
        "Referrer-Policy strict-origin-when-cross-origin"
        'Permissions-Policy accelerometer=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), sync-xhr=(self), usb=()';
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '480'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '120'
   
speciesFilter:
  enabled: true
  port: 8080
  discodataUrl: "https://discodata.eea.europa.eu/sql"
  refreshIntervalSeconds: 21600
  # Each filter routes `path` (ingress Prefix) through the gatekeeper; requests
  # matching `pattern` (group 1 = id) get 403 unless the id is returned by
  # `query` (discodata SQL, column must be named "id").
  filters:
  - name: species
    path: /species
    pattern: '^/species/(\d+)(?:/|$)'
    query: "select id_eunis as id from EUNIS.latest.species_information"
  - name: habitats_annex1
    path: /habitats
    pattern: '^/habitats/([^/]+)(?:/|$)'
    query: "select habitat_unique_id as id from EUNIS.latest.habitat_information where habitat_category='ANNEX1'"
  - name: habitats_eunis_revised
    path: /habitats_eunis_revised
    pattern: '^/habitats_eunis_revised/([^/]+)(?:/|$)'
    query: "select habitat_unique_id as id from EUNIS.latest.habitat_information where habitat_category='EUNISrev'"
  - name: habitats_rl
    path: /habitats_rl
    pattern: '^/habitats_rl/([^/]+)(?:/|$)'
    query: "select habitat_unique_id as id from EUNIS.latest.habitat_information where habitat_category='REDLIST'"
  - name: sites_natura2000
    path: /sites/natura2000
    pattern: '^/sites/natura2000/([^/]+)(?:/|$)'
    query: "select code_site as id from EUNIS.latest.Site_Information where source_db='NATURA2000'"
  - name: sites_national
    path: /sites/national
    pattern: '^/sites/national/([^/]+)(?:/|$)'
    query: "select code_site as id from EUNIS.latest.Site_Information where source_db='CDDA_NATIONAL'"
  - name: sites_emerald
    path: /sites/emerald
    pattern: '^/sites/emerald/([^/]+)(?:/|$)'
    query: "select code_site as id from EUNIS.latest.Site_Information where source_db='Emerald'"
  image:
    repository: python
    tag: "3.12-alpine"
  resources:
    limits:
      memory: 256Mi
    requests:
      memory: 128Mi

ingressredirects:
- enabled: false
  tls: true
  certificate: www.dev-biodiversity.01dev.eea.europa.eu-tls
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
  hostname: www.dev-biodiversity.01dev.eea.europa.eu

iasRedirect:
  enabled: true
  hostname: ias.eea.europa.eu
  redirectTo: https://biodiversity.europa.eu/resources/invasive-alien-species
  tls: true
  certificate:
  annotations:


links:
  backend: backend-varnish.bise

    
volto:
  serviceType: NodePort
  hostname: dev-biodiversity.01dev.eea.europa.eu
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetMemoryUtilizationPercentage: 60
  replicaCount: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  environment:
    SENTRY_URL: 
    SENTRY_AUTH_TOKEN: 
    SENTRY_ORG: 
    SENTRY_PROJECT: 
    RAZZLE_SENTRY_DSN: 
    RAZZLE_BACKEND_NAME: 'bise-backend'
    RAZZLE_ALLOWED_CORS_DESTINATIONS: 
    RAZZLE_MATOMO_URL:
    RAZZLE_MATOMO_SITE_ID: 
    RAZZLE_MATOMO_SECOND_SITE_ID:
    RAZZLE_MATOMO_SECOND_TRACKER_URL: 
    RAZZLE_INTERNAL_API_PATH: "http://backend:8080/Plone"
    PROXY_ES_DSN_globalsearch: http://es_internal.ai-lab-aws.eea.europa.eu:9200/data_searchui
    PROXY_QA_DSN_globalsearch: http://nlp_internal.ai-lab-aws.eea.europa.eu:9200/api
    VOLTO_ROBOTSTXT:
    RAZZLE_DISABLE_DRAFT_WATERMARK: 
    CSP_HEADER: >-
      default-src 'none';
      base-uri 'self';
      worker-src 'self' blob:;
      form-action 'self';
      object-src 'none';
      manifest-src 'self';
      media-src https://*.eea.europa.eu;
      connect-src 'self' https://*.discomap.eea.europa.eu https://public.tableau.com https://*.eea.europa.eu https://europa.eu https://webanalytics.europa.eu https://gisco-services.ec.europa.eu https://geocode.arcgis.com https://api.openaire.eu https://api.openaire.com https://api.zotero.org https://cdn.arcgis.com https://www.arcgis.com https://utility.arcgisonline.com https://js.arcgis.com https://services.arcgisonline.com https://services.arcgis.com https://static.arcgis.com https://basemaps.arcgis.com https://*.arcgis.com https://*.eionet.europa.eu;
      font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com https://*.eea.europa.eu https://cdn.arcgis.com https://js.arcgis.com https://*.eionet.europa.eu https://eea.maps.arcgis.com;
      frame-src 'self' https://europa.eu https://*.europa.eu https://*.discomap.eea.europa.eu https://public.tableau.com https://*.eea.europa.eu https://eea.maps.arcgis.com;
      img-src https: blob: data:;
      script-src 'self' {nonce} blob: https://*.discomap.eea.europa.eu https://public.tableau.com https://matomo.eea.europa.eu https://europa.eu https://www.google.com https://www.gstatic.com https://ajax.googleapis.com https://spreadsheets.google.com https://docs.google.com https://*.eionet.europa.eu https://*.eea.europa.eu https://d3js.org https://cdnjs.cloudflare.com https://code.jquery.com https://services.arcgis.com https://js.arcgis.com https://api.openaire.eu https://api.openaire.com https://api.zotero.org https://geocode.arcgis.com;
      style-src 'self' 'unsafe-inline' https://*.discomap.eea.europa.eu https://www.google.com https://europa.eu https://fonts.googleapis.com https://js.arcgis.com https://api.openaire.eu https://api.openaire.com https://api.zotero.org https://ajax.googleapis.com https://www.gstatic.com https://*.eionet.europa.eu https://*.eea.europa.eu https://cdnjs.cloudflare.com https://code.jquery.com;
      frame-ancestors 'self' https://*.eionet.europa.eu https://*.eea.europa.eu;
      upgrade-insecure-requests;
      report-to csp-endpoint;
      report-uri https://sentry.eea.europa.eu/api/49/security/?sentry_key=0343e20fc4e0469790b6016561f032e3;
  annotations: {}
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 4
    successThreshold: 2

debug:
  addonsPath: /app/src/addons
  affinity: {}
  enabled: false
  environment: {}
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext: {}
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 3Gi
  securityContext: {}
  serviceType: NodePort
  tolerations: []

varnish:
  serviceType: NodePort
  serviceName: frontend-varnish
  port: 3000
  backend: "frontend-volto"
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 3Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  environment:
    VARNISH_SIZE: '2G'
    VARNISH_DNS_TTL: '20s'
    VARNISH_BERESP_TTL: '60s'
    VARNISH_BERESP_GRACE: '120s'
    VARNISH_BERESP_KEEP: '120s'
    VARNISH_GZIP_ENABLED: 'false'
    AUTOKILL_CRON: ''
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1

