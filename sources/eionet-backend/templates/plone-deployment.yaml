apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dpl-plone
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: plone

spec:
  # One instance: filestorage allows a single Zope process, so the old pod
  # must stop before the new one opens the database
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: plone

  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: plone
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}

      {{- if .Values.setup.enabled }}
      # Create the Plone site if it does not exist yet
      initContainers:
      - name: create-site
        image: {{ include "appl.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - create-classic
        env:
        {{- include "appl.ploneEnv" . | nindent 8 }}
        - name: SITE_ID
          value: "{{ .Values.plone.site }}"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.setup.resources | nindent 10 }}
      {{- end }}

      containers:
      - name: plone
        image: {{ include "appl.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        {{- include "appl.ploneEnv" . | nindent 8 }}

        ports:
        - name: http
          containerPort: 8080

        volumeMounts:
        - name: data
          mountPath: /data

        {{- if (.Values.plone.livenessProbe) }}
        livenessProbe:
          {{- toYaml .Values.plone.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.plone.startupProbe) }}
        startupProbe:
          {{- toYaml .Values.plone.startupProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.plone.readinessProbe) }}
        readinessProbe:
          {{- toYaml .Values.plone.readinessProbe | nindent 10 }}
        {{- end }}

        resources:
          {{- toYaml .Values.plone.resources | nindent 10 }}

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data

      {{- with .Values.plone.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plone.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plone.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
