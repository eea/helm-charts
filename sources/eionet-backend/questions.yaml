  questions:

  - variable: "plone.hostname"
    label: "Hostname"
    description: "Public domain, e.g. eionet-backend.01dev.eea.europa.eu"
    type: "string"
    required: true
    group: "General"
  - variable: "ingress.tls"
    label: "Enable https"
    type: "boolean"
    default: true
    required: true
    group: "General"
  - variable: "ingress.letsencrypt"
    label: "Ingress letsencrypt cluster-issuer"
    description: "Leave empty when not using letsencrypt"
    default: "01dev-eea-letsencrypt"
    type: "string"
    group: "General"
  - variable: "ingress.certificate"
    label: "Certificate name"
    description: "Use a new name for letsencrypt certificates, for existing certificate write the correct name for the domain, leave blank for kube default"
    default: "eionet-backend.01dev.eea.europa.eu-tls"
    type: "string"
    group: "General"
  - variable: "ingress.configuration.whitelist-source-range"
    label: "Allowed source IPs"
    description: "Comma separated CIDRs allowed to reach the site. Leave empty for public access"
    type: "string"
    default: ""
    group: "General"
  - variable: "ldap.server"
    label: "LDAP server"
    description: "host:port, connected over ldaps"
    type: "string"
    required: true
    group: "LDAP"
  - variable: "ldap.adminDN"
    label: "LDAP admin DN"
    description: "Bind account with write access"
    type: "string"
    required: true
    group: "LDAP"
  - variable: "ldap.adminPassword"
    label: "LDAP admin password"
    type: "password"
    required: true
    group: "LDAP"
  - variable: "ldap.secondaryDN"
    label: "LDAP read-only DN"
    description: "Read-only bind account, also used by the LDAP dump"
    type: "string"
    required: true
    group: "LDAP"
  - variable: "ldap.secondaryPassword"
    label: "LDAP read-only password"
    type: "password"
    required: true
    group: "LDAP"
  - variable: "mail.from"
    label: "Mail sender address"
    type: "string"
    required: true
    group: "Mail"
  - variable: "postfix.mtpRelay"
    label: "SMTP relay"
    type: "string"
    default: "ironports.eea.europa.eu"
    group: "Mail"
  - variable: "postfix.mtpPort"
    label: "SMTP relay port"
    type: "string"
    default: "8587"
    group: "Mail"
  - variable: "postfix.mtpUser"
    label: "SMTP relay user"
    type: "string"
    group: "Mail"
  - variable: "postfix.mtpPass"
    label: "SMTP relay password"
    type: "password"
    group: "Mail"
  - variable: "postfix.dryrun"
    label: "Do not send emails"
    description: "Postfix accepts and drops all emails"
    type: "boolean"
    default: true
    group: "Mail"
  - variable: "persistence.storageClass"
    label: "Data storage class"
    description: "Must support ReadWriteMany, e.g. nfs-rancher. Leave empty for the cluster default"
    type: "string"
    group: "Storage"
