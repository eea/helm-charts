questions:
  - variable: "ingress.enabled"
    label: "Enable ingress"
    description: "Create an Ingress resource for external access"
    default: false
    type: "boolean"
    required: true
    group: "General"

  - variable: "ingress.hosts[0].host"
    label: "Server name"
    description: "DNS name exposed by ingress"
    default: "eunis.eea.europa.eu"
    type: "string"
    required: true
    group: "General"
    show_if: "ingress.enabled=true"

  - variable: "oldIngress.enabled"
    label: "Enable old-eunis ingress"
    description: "Create an Ingress resource pointing directly at Tomcat for the legacy application"
    default: false
    type: "boolean"
    required: true
    group: "General"

  - variable: "oldIngress.hosts[0].host"
    label: "Old-eunis server name"
    description: "DNS name exposed by the legacy ingress"
    default: "old-eunis.eea.europa.eu"
    type: "string"
    required: true
    group: "General"
    show_if: "oldIngress.enabled=true"

  - variable: "oldIngress.restrictFromInternet"
    label: "Restrict to internal networks"
    description: "Whitelist only internal EEA source ranges, blocking access from the internet"
    default: true
    type: "boolean"
    required: true
    group: "General"
    show_if: "oldIngress.enabled=true"

  - variable: "apache.enabled"
    label: "Enable Apache static server"
    description: "Serve static assets (images, 404 page) directly from Apache and redirects."
    default: false
    type: "boolean"
    required: true
    group: "General"

  - variable: "apache.redirectConfig"
    label: "Apache redirect rules"
    description: "Apache RewriteRule directives applied before the static image/404 aliases; unmatched requests go to 404"
    default: |-
      RewriteRule ^/species/([0-9]+)$ https://biodiversity.europa.eu/species/$1 [R=301,L,NE]
    type: "multiline"
    required: false
    group: "General"
    show_if: "apache.enabled=true"

  - variable: "apache.extraConfig"
    label: "Apache extra config"
    description: "Additional Apache directives appended inside the VirtualHost"
    type: "multiline"
    required: false
    group: "General"
    show_if: "apache.enabled=true"
