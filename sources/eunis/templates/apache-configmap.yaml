{{- if eq (include "appl.apacheEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appl.fullname" . }}-apache-config
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: apache
data:
  vh-my-app.conf: |-
    {{- $hosts := .Values.ingress.hosts }}
    {{- if and .Values.ingress.host $hosts }}
    {{- $hosts = list (merge (dict "host" .Values.ingress.host) (index $hosts 0)) }}
    {{- end }}
    <VirtualHost *:80>
      {{- if $hosts }}
      ServerName {{ (index $hosts 0).host }}
      {{- range $index, $host := $hosts }}
      {{- if gt $index 0 }}
      ServerAlias {{ $host.host }}
      {{- end }}
      {{- end }}
      {{- end }}

      ProxyRequests Off
      ProxyPreserveHost On
      RewriteEngine On

      {{- with .Values.apache.redirectConfig }}
{{ . | trim | nindent 6 }}

      {{- end }}

      {{- with .Values.apache.extraConfig }}
{{ . | trim | nindent 6 }}

      {{- end }}

      RewriteRule ^/$ /404-not-found [L]

      Alias /images /var/local/eunis/images
      <Directory "/var/local/eunis/images">
        Require all granted
        Options -Indexes
      </Directory>

      Alias /404.html /var/local/eunis/404.html
      <Files "404.html">
        Require all granted
      </Files>
      ErrorDocument 404 /404.html
    </VirtualHost>
{{- end }}
