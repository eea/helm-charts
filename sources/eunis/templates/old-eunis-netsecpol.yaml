#
# Allow the ingress controller to reach Tomcat directly for the old-eunis ingress,
# which bypasses Apache even when Apache is enabled.
#
{{ if .Values.oldIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-old-ingress-nginx
  labels:
    {{- include "appl.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: frontend
  policyTypes:
  - Ingress

  ingress:
  - ports:
    - port: {{ .Values.service.port }}
      protocol: TCP
{{- end }}
