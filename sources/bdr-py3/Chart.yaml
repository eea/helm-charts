apiVersion: v2
name: bdr-py3
description: A BDR Helm chart for Kubernetes (Python 3 / Zope 5+ stack)
icon: https://raw.githubusercontent.com/eea/helm-charts/main/sources/bdr/logo_eionet.png
type: application
version: 0.1.5
appVersion: "z5-1.10"
dependencies:
  - name: rn-zeoserver
    version: 0.2.0
    repository: https://eea.github.io/helm-charts
    alias: zeoserver
  - name: rn-local-converters
    version: 0.1.13
    repository: https://eea.github.io/helm-charts
    condition: local-converters.enabled
    alias: local-converters
  - name: rn-clamav
    version: 1.0.0
    repository: https://eea.github.io/helm-charts
    condition: clamav.enabled
    alias: clamav
  - name: rn-bdr-ldap
    version: 0.1.2
    repository: https://eea.github.io/helm-charts
    alias: ldap
  - name: rn-bdr-registry
    version: 0.2.0
    repository: https://eea.github.io/helm-charts
    alias: bdr-registry
  - name: postgresql
    version: 15.2.8
    repository: https://charts.bitnami.com/bitnami
  - name: postfix
    version: 3.2.0
    repository: https://eea.github.io/helm-charts
    condition: postfix.enabled
  - name: rn-bdr-registry-notifications
    version: 0.2.1
    repository: https://eea.github.io/helm-charts
    alias: bdr-registry-notifications
  - name: rn-bdr-registry-notifications
    version: 0.2.1
    repository: https://eea.github.io/helm-charts
    alias: bdr-registry-notifications-async
  - name: rn-bdr-european-registry
    version: 1.0.4
    repository: https://eea.github.io/helm-charts
    alias: european-registry
  - name: rn-bdr-european-registry
    version: 1.0.4
    repository: https://eea.github.io/helm-charts
    alias: european-registry-sync
  - name: rn-apache
    version: 0.1.8
    repository: https://eea.github.io/helm-charts
    alias: apache
