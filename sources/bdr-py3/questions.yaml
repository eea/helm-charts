questions:
  # Basic Settings
  - variable: timezone
    label: "Timezone"
    type: string
    default: "Europe/Copenhagen"
    group: "Basic Settings"

  - variable: instance.replicaCount
    label: "Number of BDR zope instances"
    type: int
    min: 1
    default: 2
    group: "Basic Settings"

  # Core components
  - variable: instance.resources.requests.memory
    label: "Zope instance Memory Request"
    type: string
    default: "5Gi"
    group: "Core components"

  - variable: instance.resources.limits.memory
    label: "Zope instance Memory Limit"
    type: string
    default: "5Gi"
    group: "Core components"

  - variable: instance.resources.requests.cpu
    label: "Zope instance CPU Request"
    type: string
    default: "500m"
    group: "Core components"

  - variable: autoscaling.enabled
    label: "Enable Zope instances Autoscaling"
    type: boolean
    default: false
    group: "Core components"
    show_subquestion_if: true
    subquestions:
      - variable: autoscaling.minReplicas
        label: "Minimum Replicas"
        type: int
        default: 1
        group: "Core components"

      - variable: autoscaling.maxReplicas
        label: "Maximum Replicas"
        type: int
        default: 2
        group: "Core components"

  - variable: zeoserver.storage
    label: "ZEO Server Storage Size"
    type: string
    default: "150Gi"
    group: "Core components"

  - variable: zeoserver.accessMode
    label: "ZEO Server Storage Access Mode"
    description: "Set to ReadWriteMany on a storage class that supports it (e.g. nfs-client) to allow shared-blob mode (instance pods mount the same volume directly)."
    type: enum
    options:
      - "ReadWriteOnce"
      - "ReadWriteMany"
    default: "ReadWriteMany"
    group: "Core components"

  - variable: zeoserver.resources.requests.memory
    label: "ZEO Server Memory Request"
    type: string
    default: "1Gi"
    group: "Core components"


  - variable: local-converters.resources.requests.memory
    label: "Local Converters Memory Request"
    type: string
    default: "1.5Gi"
    group: "Core components"

  - variable: local-converters.resources.requests.cpu
    label: "Local Converters CPU Request"
    type: string
    default: "300m"
    group: "Core components"

  - variable: local-converters.resources.limits.memory
    label: "Local Converters Memory Limit"
    type: string
    default: "1.5Gi"
    group: "Core components"

  - variable: local-converters.autoscaling.enabled
    label: "Enable Autoscaling for Local Converters"
    type: boolean
    default: false
    group: "Core components"
    show_subquestion_if: true
    subquestions:
      - variable: local-converters.autoscaling.minReplicas
        label: "Minimum Replicas for Local Converters"
        type: int
        default: 1
        group: "Core components"
      - variable: local-converters.autoscaling.maxReplicas
        label: "Maximum Replicas for Local Converters"
        type: int
        default: 2
        group: "Core components"

  - variable: clamav.storage
    label: "ClamAV Storage Size"
    type: string
    default: "1Gi"
    group: "Core components"

  - variable: clamav.resources.requests.memory
    label: "ClamAV Memory Request"
    type: string
    default: "3.5Gi"
    group: "Core components"

  - variable: clamav.resources.requests.cpu
    label: "ClamAV CPU Request"
    type: string
    default: "300m"
    group: "Core components"

  - variable: clamav.resources.limits.memory
    label: "ClamAV Memory Limit"
    type: string
    default: "3.5Gi"
    group: "Core components"

  - variable: clamav.resources.limits.cpu
    label: "ClamAV CPU Limit"
    type: int
    default: 1
    group: "Core components"

  - variable: clamav.autoscaling.enabled
    label: "Enable Autoscaling for ClamAV"
    type: boolean
    default: true
    group: "Core components"
    show_subquestion_if: true
    subquestions:
      - variable: clamav.autoscaling.minReplicas
        label: "Minimum Replicas for ClamAV"
        type: int
        default: 1
        group: "Core components"
      - variable: clamav.autoscaling.maxReplicas
        label: "Maximum Replicas for ClamAV"
        type: int
        default: 2
        group: "Core components"
      - variable: clamav.autoscaling.targetCPUUtilizationPercentage
        label: "Target CPU Utilization Percentage for ClamAV"
        type: int
        default: 80
        group: "Core components"

  # BDR auxiliary components
  - variable: postgresql.auth.existingSecret
    label: "PostgreSQL Credentials Secret"
    description: "Existing Secret with postgres-password, password, and replication-password keys. Leave empty to use deploy-time inline or generated passwords."
    type: string
    default: ""
    group: "BDR auxiliary components"

  - variable: postgresql.auth.postgresPassword
    label: "PostgreSQL Admin Password"
    description: "Inject at deploy time when no existing Secret is used; do not commit production credentials."
    type: password
    default: ""
    group: "BDR auxiliary components"

  - variable: postgresql.auth.database
    label: "PostgreSQL Database"
    type: string
    default: ""
    group: "BDR auxiliary components"

  - variable: postgresql.auth.username
    label: "PostgreSQL Username"
    type: string
    default: ""
    group: "BDR auxiliary components"

  - variable: postgresql.auth.password
    label: "PostgreSQL User Password"
    type: password
    default: ""
    group: "BDR auxiliary components"

  - variable: postfix.enabled
    label: "Enable Postfix"
    type: boolean
    default: true
    group: "BDR auxiliary components"

  - variable: postfix.serverName
    label: "Postfix Server Name"
    type: string
    default: "bdr.eionet.europa.eu"
    group: "BDR auxiliary components"

  - variable: ldap.storage
    label: "LDAP Storage Size"
    type: string
    default: "1Gi"
    group: "BDR auxiliary components"

  - variable: ldap.rootDN
    label: "LDAP Root DN"
    type: string
    default: ""
    group: "BDR auxiliary components"

  - variable: ldap.rootPW
    label: "LDAP Root Password"
    type: password
    default: ""
    group: "BDR auxiliary components"

  - variable: bdr-registry.bdrServerUrl
    label: "BDR Registry Server URL"
    type: string
    default: "https://bdr.eionet.europa.eu/"
    group: "BDR auxiliary components"

  - variable: bdr-registry.databasesHost
    label: "BDR Registry Database Host"
    type: string
    default: ""
    group: "BDR auxiliary components"

  - variable: bdr-registry.databasesPassword
    label: "BDR Registry Database Password"
    type: password
    default: ""
    group: "BDR auxiliary components"

  - variable: bdr-registry.bdrApiAuthUser
    label: "BDR Registry API User"
    type: string
    default: ""
    group: "BDR auxiliary components"

  - variable: bdr-registry.bdrApiAuthPassword
    label: "BDR Registry API Password"
    type: password
    default: ""
    group: "BDR auxiliary components"

  - variable: european-registry.bdrEndpointUrl
    label: "European Registry BDR Endpoint"
    type: string
    default: "https://bdr.eionet.europa.eu"
    group: "BDR auxiliary components"

  - variable: european-registry.apiToken
    label: "European Registry API Token"
    type: password
    default: ""
    group: "BDR auxiliary components"

  - variable: apache.serverName
    label: "Apache Server Name"
    type: string
    default: "bdr.eionet.europa.eu"
    group: "BDR auxiliary components"

  - variable: apache.adminAuth.existingSecret
    label: "Apache Admin Auth Secret"
    description: "Existing Secret containing auth (nginx) and users (Traefik) keys."
    type: string
    default: ""
    group: "BDR auxiliary components"

  - variable: apache.adminAuth.htpasswd
    label: "Apache Admin htpasswd"
    description: "Required when admin paths are enabled and no existing Secret is configured."
    type: password
    default: ""
    group: "BDR auxiliary components"

  - variable: memcached.enabled
    label: "Enable Memcached"
    description: "Deploy an in-cluster memcached used as an LDAP lookup cache by the Zope instances. When enabled, also set the LDAP memcached servers env var below."
    type: boolean
    default: true
    group: "Core components"
    show_subquestion_if: true
    subquestions:
      - variable: memcached.image.tag
        label: "Memcached Image Tag"
        type: string
        default: "1.6.34-alpine"
        group: "Core components"
      - variable: memcached.maxMemory
        label: "Memcached Max Memory (MB)"
        description: "Value passed to memcached's -m flag (slab allocator size in megabytes)."
        type: int
        default: 64
        group: "Core components"
      - variable: memcached.resources.requests.memory
        label: "Memcached Memory Request"
        type: string
        default: "96Mi"
        group: "Core components"
      - variable: memcached.resources.limits.memory
        label: "Memcached Memory Limit"
        type: string
        default: "128Mi"
        group: "Core components"

  - variable: rabbitmq.create
    label: "Create RabbitMQ"
    type: boolean
    default: false
    group: "Core components"

  - variable: rabbitmq.name
    label: "RabbitMQ Name"
    type: string
    default: "rabbitmq"
    group: "Core components"

  # Cron jobs
  - variable: cron.enabled
    label: "Enable Cron Jobs (master switch)"
    description: "Master switch for all cron jobs. Each individual cron also has its own enabled flag — both must be true for a job to run."
    type: boolean
    default: true
    group: "Cron jobs"

  - variable: cronzeopack.enabled
    label: "Enable Cron zeopack"
    type: boolean
    default: false
    group: "Cron jobs"

  - variable: cronzeopack.schedule
    label: "Cron zeopack Schedule"
    type: string
    default: "0 3 * * *"
    show_if: "cronzeopack.enabled"
    group: "Cron jobs"

  - variable: cronzeopack.repository
    label: "Cron zeopack Image Repository"
    description: "zeopack uses the ZEO server image, not the BDR instance image."
    type: string
    default: "eeacms/reportek.zeoserver"
    show_if: "cronzeopack.enabled"
    group: "Cron jobs"

  - variable: cronzeopack.tag
    label: "Cron zeopack Image Tag"
    description: "Required — no fallback to Chart.AppVersion."
    type: string
    default: "z5-1.0"
    show_if: "cronzeopack.enabled"
    group: "Cron jobs"

  # Networking

  - variable: cronsessionscleanup.enabled
    label: "Enable Sessions Cleanup Cron"
    type: boolean
    default: true
    group: "Cron jobs"

  - variable: cronsessionscleanup.schedule
    label: "Sessions Cleanup Schedule"
    type: string
    default: "0 4 * * *"
    show_if: "cronsessionscleanup.enabled=true"
    group: "Cron jobs"

  - variable: cron.sharedCronJobImage
    label: "Shared Curl Cron Image"
    type: string
    default: "curlimages/curl:8.16.0"
    group: "Cron jobs"

  - variable: cron.tokenSecretName
    label: "Existing Sync Token Secret"
    description: "Existing Secret containing one key per enabled sync job. Leave empty to render a chart-managed Secret from the job token fields."
    type: string
    default: ""
    group: "Cron jobs"

  - variable: cron.connectTimeoutSeconds
    label: "Curl Connect Timeout"
    type: int
    default: 10
    group: "Cron jobs"

  - variable: cron.maxTimeSeconds
    label: "Curl Maximum Runtime"
    type: int
    default: 300
    group: "Cron jobs"

  - variable: cron.activeDeadlineSeconds
    label: "Sync Job Deadline"
    type: int
    default: 360
    group: "Cron jobs"

  - variable: synccronjobs.0.enabled
    label: "Enable Sync FGases Cron"
    type: boolean
    default: false
    group: "BDR sync cron jobs"

  - variable: synccronjobs.0.schedule
    label: "Sync FGases Schedule"
    type: string
    default: "2-59/5 * * * *"
    show_if: "synccronjobs.0.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.0.tokenSecretKey
    label: "Sync FGases Token Key"
    description: "Key in the generated or existing Secret containing this job's token."
    type: string
    default: "sync-fgases"
    show_if: "synccronjobs.0.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.0.token
    label: "Sync FGases Token"
    description: "Required when enabled and cron.tokenSecretName is empty; stored in the chart-managed Secret."
    type: password
    default: ""
    show_if: "synccronjobs.0.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.0.syncURL
    label: "Sync FGases URL"
    type: string
    default: ""
    show_if: "synccronjobs.0.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.1.enabled
    label: "Enable Sync ODS Cron"
    type: boolean
    default: false
    group: "BDR sync cron jobs"

  - variable: synccronjobs.1.schedule
    label: "Sync ODS Schedule"
    type: string
    default: "3-59/5 * * * *"
    show_if: "synccronjobs.1.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.1.tokenSecretKey
    label: "Sync ODS Token Key"
    description: "Key in the generated or existing Secret containing this job's token."
    type: string
    default: "sync-ods"
    show_if: "synccronjobs.1.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.1.token
    label: "Sync ODS Token"
    description: "Required when enabled and cron.tokenSecretName is empty; stored in the chart-managed Secret."
    type: password
    default: ""
    show_if: "synccronjobs.1.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.1.syncURL
    label: "Sync ODS URL"
    type: string
    default: ""
    show_if: "synccronjobs.1.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.2.enabled
    label: "Enable Sync Licences Cron"
    type: boolean
    default: false
    group: "BDR sync cron jobs"

  - variable: synccronjobs.2.schedule
    label: "Sync Licences Schedule"
    type: string
    default: "6 0 * * *"
    show_if: "synccronjobs.2.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.2.tokenSecretKey
    label: "Sync Licences Token Key"
    description: "Key in the generated or existing Secret containing this job's token."
    type: string
    default: "sync-licences"
    show_if: "synccronjobs.2.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.2.token
    label: "Sync Licences Token"
    description: "Required when enabled and cron.tokenSecretName is empty; stored in the chart-managed Secret."
    type: password
    default: ""
    show_if: "synccronjobs.2.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.2.syncURL
    label: "Sync Licences URL"
    type: string
    default: ""
    show_if: "synccronjobs.2.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.3.enabled
    label: "Enable Sync Match Cron"
    type: boolean
    default: false
    group: "BDR sync cron jobs"

  - variable: synccronjobs.3.schedule
    label: "Sync Match Schedule"
    type: string
    default: "4-59/5 * * * *"
    show_if: "synccronjobs.3.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.3.tokenSecretKey
    label: "Sync Match Token Key"
    description: "Key in the generated or existing Secret containing this job's token."
    type: string
    default: "sync-match"
    show_if: "synccronjobs.3.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.3.token
    label: "Sync Match Token"
    description: "Required when enabled and cron.tokenSecretName is empty; stored in the chart-managed Secret."
    type: password
    default: ""
    show_if: "synccronjobs.3.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.3.syncURL
    label: "Sync Match URL"
    type: string
    default: ""
    show_if: "synccronjobs.3.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.4.enabled
    label: "Enable Sync Stocks Cron"
    type: boolean
    default: false
    group: "BDR sync cron jobs"

  - variable: synccronjobs.4.schedule
    label: "Sync Stocks Schedule"
    type: string
    default: "0 3 * * *"
    show_if: "synccronjobs.4.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.4.tokenSecretKey
    label: "Sync Stocks Token Key"
    description: "Key in the generated or existing Secret containing this job's token."
    type: string
    default: "sync-stocks"
    show_if: "synccronjobs.4.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.4.token
    label: "Sync Stocks Token"
    description: "Required when enabled and cron.tokenSecretName is empty; stored in the chart-managed Secret."
    type: password
    default: ""
    show_if: "synccronjobs.4.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.4.syncURL
    label: "Sync Stocks URL"
    type: string
    default: ""
    show_if: "synccronjobs.4.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.5.enabled
    label: "Enable Notifications Fetch Cron"
    type: boolean
    default: false
    group: "BDR sync cron jobs"

  - variable: synccronjobs.5.schedule
    label: "Notifications Fetch Schedule"
    type: string
    default: "15 0 * * *"
    show_if: "synccronjobs.5.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.5.tokenSecretKey
    label: "Notifications Fetch Token Key"
    description: "Key in the generated or existing Secret containing this job's token."
    type: string
    default: "notifications-fetch"
    show_if: "synccronjobs.5.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.5.token
    label: "Notifications Fetch Token"
    description: "Required when enabled and cron.tokenSecretName is empty; stored in the chart-managed Secret."
    type: password
    default: ""
    show_if: "synccronjobs.5.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.5.syncURL
    label: "Notifications Fetch URL"
    type: string
    default: ""
    show_if: "synccronjobs.5.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.6.enabled
    label: "Enable Sync Auditors Cron"
    type: boolean
    default: false
    group: "BDR sync cron jobs"

  - variable: synccronjobs.6.schedule
    label: "Sync Auditors Schedule"
    type: string
    default: "30 * * * *"
    show_if: "synccronjobs.6.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.6.tokenSecretKey
    label: "Sync Auditors Token Key"
    description: "Key in the generated or existing Secret containing this job's token."
    type: string
    default: "sync-auditors"
    show_if: "synccronjobs.6.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.6.token
    label: "Sync Auditors Token"
    description: "Required when enabled and cron.tokenSecretName is empty; stored in the chart-managed Secret."
    type: password
    default: ""
    show_if: "synccronjobs.6.enabled=true"
    group: "BDR sync cron jobs"

  - variable: synccronjobs.6.syncURL
    label: "Sync Auditors URL"
    type: string
    default: ""
    show_if: "synccronjobs.6.enabled=true"
    group: "BDR sync cron jobs"

  - variable: ingress.enabled
    label: "Enable Ingress"
    type: boolean
    default: false
    group: "Networking"

  - variable: ingress.type
    label: "Ingress Type"
    type: enum
    default: "nginx"
    options:
      - "nginx"
      - "gatewayAPI"
    group: "Networking"
    show_if: "ingress.enabled=true"

  - variable: ingress.hostname
    label: "Ingress Hostname"
    type: string
    default: "bdr.eionet.europa.eu"
    group: "Networking"
    show_if: "ingress.enabled=true"

  - variable: ingress.tlsSecretName
    label: "TLS Secret Name"
    type: string
    default: ""
    group: "Networking"
    show_if: "ingress.enabled=true"

  - variable: ingress.nginx.className
    label: "Ingress Class Name"
    type: string
    default: "nginx"
    group: "Networking"
    show_if: "ingress.enabled=true&&ingress.type=nginx"

  - variable: ingress.nginx.annotationPrefix
    label: "Annotation Prefix"
    type: string
    default: "nginx.ingress.kubernetes.io"
    group: "Networking"
    show_if: "ingress.enabled=true&&ingress.type=nginx"

  - variable: ingress.gatewayAPI.gatewayName
    label: "Gateway Name"
    type: string
    default: "traefik-gateway"
    group: "Networking"
    show_if: "ingress.enabled=true&&ingress.type=gatewayAPI"

  - variable: ingress.gatewayAPI.gatewayNamespace
    label: "Gateway Namespace"
    type: string
    default: ""
    group: "Networking"
    show_if: "ingress.enabled=true&&ingress.type=gatewayAPI"
    description: "Namespace where the Gateway resource lives (leave empty if it's in the same namespace as the release)"

  - variable: ingress.gatewayAPI.sectionName
    label: "Gateway Section Name"
    type: string
    default: "websecure"
    group: "Networking"
    show_if: "ingress.enabled=true&&ingress.type=gatewayAPI"

  # Webforms Configuration
  - variable: webforms.0.enabled
    label: "Enable Webforms Integration"
    type: boolean
    default: false
    group: "Webforms"
    description: "Enable or disable the webforms external service integration"

  - variable: webforms.0.upstream.host
    label: "Webforms External Host"
    type: string
    default: "webforms.eionet.europa.eu"
    group: "Webforms"
    show_if: "webforms.0.enabled=true"
    description: "External hostname of the webforms service (used as DNS name, Host header, and SNI)"

  - variable: webforms.0.publicPath
    label: "Webforms Path"
    type: string
    default: "/webforms"
    group: "Webforms"
    show_if: "webforms.0.enabled=true"
    description: "URL path prefix exposed on the public ingress (the chart adds the rewrite for nginx and uses PathPrefix for gatewayAPI)"

  - variable: webforms.0.proxyBodySize
    label: "Maximum Request Body Size"
    type: string
    default: "10m"
    group: "Webforms"
    show_if: "webforms.0.enabled=true"
    description: "Maximum allowed size of the client request body"

  - variable: webforms.0.upstream.readTimeout
    label: "Upstream Read Timeout"
    type: string
    default: "60"
    group: "Webforms"
    show_if: "webforms.0.enabled=true"
    description: "Seconds to wait for a response from the external service"

  - variable: webforms.0.upstream.sendTimeout
    label: "Upstream Send Timeout"
    type: string
    default: "60"
    group: "Webforms"
    show_if: "webforms.0.enabled=true"
    description: "Seconds to wait while sending a request to the external service"

  # Advanced Settings
  - variable: instance.env.zopeThreads
    label: "Zope Threads"
    type: int
    default: 4
    group: "Advanced Settings"

  - variable: instance.existingSecret
    label: "Instance Environment Secret"
    description: "Existing Secret containing BEAKER_SECRET, SESSION_SECRET, RABBITMQ_PASS, and SENTRY_DSN."
    type: string
    default: ""
    group: "Advanced Settings"

  - variable: instance.env.sessionSecret
    label: "Session Secret"
    description: "Required when no instance environment Secret is configured; inject at deploy time."
    type: password
    default: ""
    group: "Advanced Settings"

  - variable: instance.env.beakerPath
    label: "Beaker Path"
    type: string
    default: "/sessions"
    group: "Advanced Settings"

  - variable: instance.env.sessionCookieExpires
    label: "Session Cookie Expires"
    type: string
    default: "false"
    group: "Advanced Settings"

  - variable: instance.env.sessionCookieSecure
    label: "Secure Session Cookie"
    type: enum
    options:
      - "true"
      - "false"
    default: "true"
    group: "Advanced Settings"

  - variable: instance.env.sessionCookieHttpOnly
    label: "HTTPOnly Session Cookie"
    type: enum
    options:
      - "true"
      - "false"
    default: "true"
    group: "Advanced Settings"

  - variable: instance.env.sessionCookieSameSite
    label: "Session Cookie SameSite"
    type: enum
    options:
      - "Lax"
      - "Strict"
      - "None"
    default: "Lax"
    group: "Advanced Settings"

  - variable: instance.env.deploymentHost
    label: "Deployment Host"
    type: string
    default: "bdr.eionet.europa.eu"
    group: "Advanced Settings"

  - variable: instance.env.clamavHost
    label: "ClamAV Host"
