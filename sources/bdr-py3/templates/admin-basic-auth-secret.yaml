{{- if and .Values.ingress.enabled .Values.ingress.adminPaths (not .Values.apache.adminAuth.existingSecret) }}
{{- $htpasswd := required "apache.adminAuth.htpasswd is required when admin paths are enabled and apache.adminAuth.existingSecret is empty" .Values.apache.adminAuth.htpasswd -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appl.adminAuthSecretName" . }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
type: Opaque
data:
  # Consumed by nginx-ingress (nginx.ingress.kubernetes.io/auth-secret)
  auth: {{ $htpasswd | b64enc }}
  # Consumed by the Traefik BasicAuth middleware (spec.basicAuth.secret)
  users: {{ $htpasswd | b64enc }}
{{- end }}
