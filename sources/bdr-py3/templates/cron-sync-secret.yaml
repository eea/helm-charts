{{- if and .Values.cron.enabled (not .Values.cron.tokenSecretName) -}}
{{- $tokens := dict -}}
{{- $hasEnabledJobs := false -}}
{{- range $cronjob := .Values.synccronjobs -}}
{{- if $cronjob.enabled -}}
{{- $hasEnabledJobs = true -}}
{{- $key := required (printf "synccronjobs[%s].tokenSecretKey is required when the job is enabled" $cronjob.name) $cronjob.tokenSecretKey -}}
{{- $token := required (printf "synccronjobs[%s].token is required when the job is enabled and cron.tokenSecretName is empty" $cronjob.name) $cronjob.token -}}
{{- $_ := set $tokens $key $token -}}
{{- end -}}
{{- end -}}
{{- if $hasEnabledJobs }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appl.syncTokenSecretName" . }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
type: Opaque
stringData:
  {{- range $key, $token := $tokens }}
  {{ $key }}: {{ $token | quote }}
  {{- end }}
{{- end }}
{{- end }}
