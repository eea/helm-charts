{{- if not .Values.instance.existingSecret }}
{{- $sessionSecret := required "instance.env.sessionSecret is required when instance.existingSecret is empty" .Values.instance.env.sessionSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appl.instanceSecretName" . }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    app.kubernetes.io/component: zope
type: Opaque
stringData:
  BEAKER_SECRET: {{ $sessionSecret | quote }}
  SESSION_SECRET: {{ $sessionSecret | quote }}
  RABBITMQ_PASS: {{ .Values.instance.env.rabbitmqPass | quote }}
  SENTRY_DSN: {{ .Values.instance.env.sentryDSN | quote }}
{{- end }}
