{{- if and .Values.ingress.enabled (eq .Values.ingress.type "gatewayAPI") .Values.ingress.paths }}
{{- $fullName := include "appl.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-https
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-httproute
spec:
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.ingress.gatewayAPI.gatewayName }}
      {{- with .Values.ingress.gatewayAPI.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      sectionName: {{ .Values.ingress.gatewayAPI.sectionName }}
  rules:
    {{- range .Values.ingress.paths }}
    - backendRefs:
        - name: {{ .backendServiceName | default (printf "%s-apache" $fullName) }}
          port: {{ .backendPort | default 80 }}
      matches:
        - path:
            type: {{ if eq (.pathType | default "Prefix") "Exact" }}Exact{{ else }}PathPrefix{{ end }}
            value: {{ .path | quote }}
      {{- with $.Values.ingress.proxyReadTimeout }}
      timeouts:
        backendRequest: {{ printf "%ss" . | quote }}
      {{- end }}
      {{- if or $.Values.ingress.responseHeaders $.Values.ingress.rateLimit.enabled $.Values.ingress.proxyBodySize }}
      filters:
        {{- if $.Values.ingress.responseHeaders }}
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              {{- range $.Values.ingress.responseHeaders }}
              - name: {{ .name }}
                value: {{ .value | quote }}
              {{- end }}
        {{- end }}
        {{- if $.Values.ingress.rateLimit.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $fullName }}-rate-limit
        {{- end }}
        {{- if $.Values.ingress.proxyBodySize }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $fullName }}-buffering
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
