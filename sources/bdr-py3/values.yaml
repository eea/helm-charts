    # Existing Secret must contain "auth" for nginx and "users" for Traefik.
    # When empty and admin paths are enabled, htpasswd is required.
    existingSecret: ""
    # Generate with: htpasswd -nb admin yourpassword
    htpasswd: ""
  serverName: "bdr.eionet.europa.eu"
  defaultWebformsUrl: "https://webformsbdr.eionet.europa.eu"

  webforms:
    - endpoint: "odsformsNil"
      enabled: true
      webformsURL: ""
    - endpoint: "odsforms"
      enabled: true
