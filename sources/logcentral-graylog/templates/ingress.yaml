{{- /*
Web UI Ingress, like logcentral-graylog5's: the official chart's Ingress always writes a TLS
secretName (default "<fullname>-tls"), so it cannot express "TLS with the ingress controller's
default certificate" that production uses. Keep graylog.ingress.enabled false and use this one.
Same name as the official chart's Ingress, so switching between them updates it in place.
*/}}
{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host | required "ingress.host must be set when ingress.enabled is true." }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "appl.graylogFullname" . }}-web
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- range $key, $value := .Values.ingress.configuration }}
  {{- if $value }}
  {{- $name := printf "nginx.ingress.kubernetes.io/%s" $key }}
  {{- if not (hasKey $annotations $name) }}
  {{- $_ := set $annotations $name (toString $value) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "appl.graylogFullname" . }}-svc
                port:
                  number: 9000
{{- end }}
