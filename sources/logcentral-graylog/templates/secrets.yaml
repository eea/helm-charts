{{- /*
The Secrets of this chart. Generated values are read back from the cluster on every upgrade
(lookup), so they never change once created; both Secrets are kept on uninstall because the
MongoDB volumes outlive the release and hold users with these passwords.

<release>-mongodb            MongoDB root and graylog passwords, replica set keyfile, and the
                             generated Graylog root password (when rootPassword is empty).
logcentral-graylog-secrets   What the official chart reads through global.existingSecretName.
logcentral-graylog-maxmind   MaxMind account for the GeoIP sidecar, when geolocation is enabled.
*/}}
{{- if lt (int .Values.mongodb.replicas) 1 }}
{{- fail "mongodb.replicas must be at least 1." }}
{{- end }}
{{- with .Values.passwordSecret }}
{{- if lt (len .) 16 }}
{{- fail "passwordSecret must be at least 16 characters (Graylog password_secret)." }}
{{- end }}
{{- end }}
{{- $graylogSecretName := .Values.global.existingSecretName | required "global.existingSecretName must be set." }}
{{- $mongo := (lookup "v1" "Secret" .Release.Namespace (include "appl.mongodbName" .)).data | default dict }}
{{- $graylog := (lookup "v1" "Secret" .Release.Namespace $graylogSecretName).data | default dict }}

{{- $mongoRoot := index $mongo "mongodb-root-password" | default (randAlphaNum 32 | b64enc) }}
{{- $mongoGraylog := index $mongo "mongodb-graylog-password" | default (randAlphaNum 32 | b64enc) }}
{{- $keyfile := index $mongo "keyfile" | default (randAlphaNum 756 | b64enc) }}

{{- $pepper := "" }}
{{- if .Values.passwordSecret }}
{{- $pepper = .Values.passwordSecret | b64enc }}
{{- else }}
{{- $pepper = index $graylog "GRAYLOG_PASSWORD_SECRET" | default (randAlphaNum 96 | b64enc) }}
{{- end }}

{{- /* Root password order: rootPassword, then rootPasswordSha2, then the stored hash, else generated. */}}
{{- $rootPlain := "" }}
{{- $rootSha := "" }}
{{- if .Values.rootPassword }}
{{- $rootSha = .Values.rootPassword | sha256sum | b64enc }}
{{- else if .Values.rootPasswordSha2 }}
{{- if not (regexMatch "^[0-9a-f]{64}$" .Values.rootPasswordSha2) }}
{{- fail "rootPasswordSha2 must be a SHA-256 in lowercase hex (64 characters)." }}
{{- end }}
{{- $rootSha = .Values.rootPasswordSha2 | b64enc }}
{{- else if index $graylog "GRAYLOG_ROOT_PASSWORD_SHA2" }}
{{- $rootSha = index $graylog "GRAYLOG_ROOT_PASSWORD_SHA2" }}
{{- $stored := index $mongo "graylog-root-password" | default "" }}
{{- if and $stored (eq (b64dec $stored | sha256sum | b64enc) $rootSha) }}
{{- $rootPlain = $stored }}
{{- end }}
{{- else }}
{{- $generated := randAlphaNum 24 }}
{{- $rootSha = $generated | sha256sum | b64enc }}
{{- $rootPlain = $generated | b64enc }}
{{- end }}

{{- $uri := printf "mongodb://graylog:%s@%s/graylog?replicaSet=%s&authSource=admin" (b64dec $mongoGraylog) (include "appl.mongodbMembers" .) .Values.mongodb.replicaSetName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appl.mongodbName" . }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mongodb-root-password: {{ $mongoRoot }}
  mongodb-graylog-password: {{ $mongoGraylog }}
  keyfile: {{ $keyfile }}
  {{- with $rootPlain }}
  graylog-root-password: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $graylogSecretName }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    app.kubernetes.io/component: graylog
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  GRAYLOG_MONGODB_URI: {{ $uri | b64enc }}
  GRAYLOG_ROOT_USERNAME: {{ .Values.graylog.graylog.config.rootUsername | default "admin" | b64enc }}
  GRAYLOG_PASSWORD_SECRET: {{ $pepper }}
  GRAYLOG_ROOT_PASSWORD_SHA2: {{ $rootSha }}
{{- with .Values.graylog.graylog.config.geolocation }}
{{- if .enabled }}
{{- if not (and $.Values.geoip.accountId $.Values.geoip.licenseKey) }}
{{- fail "graylog.graylog.config.geolocation.enabled needs the MaxMind account: set geoip.accountId and geoip.licenseKey." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .maxmindGeoIp.existingSecret | required "graylog.graylog.config.geolocation.maxmindGeoIp.existingSecret must be set." }}
  labels:
    {{- include "appl.labels" $ | nindent 4 }}
    app.kubernetes.io/component: geoip
type: Opaque
data:
  GEO_IP_MAXMIND_ACCOUNT_ID: {{ $.Values.geoip.accountId | toString | b64enc }}
  GEO_IP_MAXMIND_LICENSE_KEY: {{ $.Values.geoip.licenseKey | toString | b64enc }}
{{- end }}
{{- end }}
