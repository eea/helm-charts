{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cca-images
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: cca-images
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
{{ include "cca-backend.ingressCommonConfigurationSnippet" . | indent 6 }}
{{ include "cca-backend.ingressSecurityHeaders" . | indent 6 }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.plone.hostname }}
      http:
        paths:
          # Route classic image/download endpoints to the FRONTEND (Volto), not
          # the backend. Volto's Express middleware (volto-cca-policy) proxies
          # them to the Plone API with the user's auth_token sent as a Bearer
          # header, so logged-in users can load images of protected content in
          # <img> tags. (Classic Plone URLs never read the auth_token cookie.)
          # No VirtualHostBase rewrite here: the path is passed through to the
          # frontend nginx, which forwards it to Volto unchanged.
          - path: /(.*)/@@images(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.links.frontend }}
                port:
                  number: 80
          - path: /(.*)/@@download(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.links.frontend }}
                port:
                  number: 80
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.plone.hostname }}
      {{- if .Values.ingress.certificate }}
      secretName: {{ .Values.ingress.certificate }}
      {{- end }}
  {{- end }}
{{- end }}
