image:
  repository: eeacms/eea.docker.plone-climateadapt
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

timezone: Europe/Copenhagen
releaseVersion: ""

links:
  createPostgresService: false
  database: postgres.database
  memcached: memcached.database
  # Frontend nginx service (separate release, same namespace). Used by the
  # cca-images ingress to route @@images/@@download through Volto, whose
  # Express middleware authenticates them with the user's auth_token.
  # Must be a bare in-namespace service name (no .release suffix) — an
  # Ingress backend cannot reference a cross-namespace FQDN.
  frontend: frontend-nginx

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  certificate: climate-adapt.eea.europa.eu-tls
  tls: true

commonEnv:
  CORS_ALLOW_ORIGIN: ""
  DEFAULT_ORGANISATIONS_cca: "EEA"
  DEFAULT_PUBLISHER_cca: "EEA"
  DYNAMIC_BANNER_ENABLED: "No"
  # Plone defers translation jobs to the 19:00-07:00 window. This has to live in
  # commonEnv, not just on plone-translate: queue_translate runs in the web
  # process, so it is the `plone` pods that stamp the delay when you click
  # "Translate all langs" or when a content rule fires on edit. The flag is read
  # once at import in translation/core.py, so a pod restart is required after
  # changing it. Left false the helper skips it entirely and the night window
  # stays active.
  ETRANSLATION_DISABLE_DAYTIME_DELAY: false
  GRAYLOG: "logcentral.eea.europa.eu:12201"
  GRAYLOG_FACILITY: ""
  MARINE_PASS: ""
  PLONE_REGISTRY_YAML_CONTENT: ""
  PORTAL_URL: "https://climate-adapt.eea.europa.eu"
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "production"
  SENTRY_RELEASE: ""
  SENTRY_SITE: ""
  STATIC_BANNER_ENABLED: "No"
  TZ: ""
  TRANSLATE_ON_CHANGE: "1"
  TRANSLATION_AUTH_TOKEN: ""

persistence:
  data:
    enabled: false
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteMany
    size: 20Gi
    mountPath: /data
  import:
    enabled: false
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteMany
    size: 5Gi
    mountPath: /app/import
  legacyImport:
    enabled: false
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteMany
    size: 5Gi
    mountPath: /cca-import
  sources:
    enabled: false
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteMany
    size: 5Gi
    mountPath: /app/sources

plone:
  serviceType: ClusterIP
  hostname: climate-adapt.eea.europa.eu
  site: cca
  googleUrl: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetMemoryUtilizationPercentage: 60
  replicaCount: 4
  resources:
    limits:
      memory: 6Gi
    requests:
      memory: 6Gi
  database:
    POSTGRES_DB: datafs
    POSTGRES_USER: zope
    POSTGRES_PASSWORD: ""
  environment:
    REDIS_PORT: "6379"
  annotations: {}
  command:
    - sh
    - -c
    - mkdir -p /tmp/plone_mail_queue/cur /tmp/plone_mail_queue/new /tmp/plone_mail_queue/tmp && chown -R plone /tmp/plone_mail_queue && ./docker-entrypoint.sh start
  # Broken-links scans can hold waitress workers for extended periods.
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 30
    timeoutSeconds: 30
    initialDelaySeconds: 60
    failureThreshold: 10
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 30
    initialDelaySeconds: 60
    failureThreshold: 36
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 15
    timeoutSeconds: 30
    initialDelaySeconds: 60
    failureThreshold: 6
    successThreshold: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

ploneTranslate:
  enabled: true
  serviceName: plone-translate
  serviceType: ClusterIP
  image:
    repository: ""
    tag: ""
    pullPolicy: Always
  releaseVersion: ""
  resources:
    limits:
      memory: 8Gi
    requests:
      memory: 8Gi
  environment:
    IS_JOB_EXECUTOR: "true"
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 20
    failureThreshold: 18
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 4
    successThreshold: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

varnish:
  serviceType: ClusterIP
  serviceName: backend-varnish
  image:
    repository: eeacms/plone-varnish
    tag: "7.7-1.2"
    pullPolicy: Always
  backend: backend-plone
  port: 8080
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  environment:
    VARNISH_SIZE: 2G
    VARNISH_DNS_TTL: "20s"
    VARNISH_BERESP_TTL: "3600s"
    VARNISH_BERESP_GRACE: "300s"
    VARNISH_BERESP_KEEP: "120s"
    VARNISH_GZIP_ENABLED: "true"
    VARNISH_GZIP_JSON_ENABLED: "true"
    VARNISH_CLEAR_OTHER_COOKIES: "true"
    AUTOKILL_CRON: ""
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1

memcachedflush:
  enabled: true
  schedule: "0 3 * * *"
  keepSuccessfulPods: 3
  keepFailedPods: 5
  image:
    repository: alpine
    tag: "3.11"
  resources:
    limits:
      memory: 64Mi
    requests:
      memory: 32Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  enabled: true
  serviceType: ClusterIP
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    mountPath: /data
  nodeSelector: {}
  tolerations: []
  affinity: {}

async:
  enabled: true
  serviceName: async
  serviceType: ClusterIP
  image:
    repository: eeacms/climateadapt-async-translate
    # v1.2.1 adds logging to the submit_group paths that exit without
    # submitting. Previously a cached or already-consumed group produced no
    # output at all, which in the logs was indistinguishable from a hung job.
    # No new env vars, no queue or schema changes.
    # v1.2.0 carried the quota-aware eTranslation work: language bundling, the
    # in-flight submission gate, handling of failure notifications.
    # Published by the GitHub release - git tag v1.2.1 = 4f1ee9b, image digest
    # sha256:037d37fda969c75d31. pullPolicy is Always and replicas is 1, so a
    # missing tag takes the translation worker down rather than leaving it on
    # the previous build.
    tag: "v1.2.1"
    pullPolicy: Always
  port: 3000
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 512Mi
  environment:
    PORTAL_URL: "https://climate-adapt.eea.europa.eu"
    TRANSLATION_AUTH_TOKEN: ""
    # etranslation_submit is the queue the bundled-submission stage uses. It is
    # inert on older builds, but the worker disables grouping at startup if the
    # queue is absent here, so the switch below would silently do nothing.
    BULL_QUEUE_NAMES_CSV: etranslation,save_etranslation,sync_paths,delete_translation,etranslation_submit
    # submit_group performs the bundled submission; translation_failed consumes
    # eTranslation's failure notification. Both must be listed here: a job name
    # the worker is not allowed to run is rejected with RateLimitError and
    # requeued for an immediate retry, i.e. a busy loop.
    ENABLED_JOBS: save_translated_html,call_etranslation,etranslation,sync_translated_paths,delete_translation,submit_group,translation_failed
    # Master switch for quota-aware submissions. It needs the Plone side that
    # accepts a comma separated target_lang plus ext_ref on @@call-etranslation
    # and forwards targetLanguage from @@translate-callback - live since
    # v11.0.82-plone6.1, so the requirement is met on v11.0.83-plone6.1.
    # Verified end to end in production: the 26 per-language jobs for an object
    # collapse into a single eTranslation request, using 1 of the service's 50
    # concurrent submissions instead of 26.
    ETL_GROUPING_ENABLED: "true"
    # eTranslation allows 50 active submissions per client. 40 leaves headroom
    # for manual work and retries.
    # Do NOT drop this back to 10. At 10 the gate itself became the bottleneck
    # and fragmented the bundling: a capacity requeue carries a frozen group
    # payload while the closed group's window gets re-armed by stragglers, so a
    # single object forked into many submissions. Measured 52 groups for 7
    # objects, only 13 of 50 submissions carrying the full 26 languages - an
    # ~8x reduction where 26x was intended, with 229 capacity requeues.
    ETL_MAX_INFLIGHT: "40"
    # How long the per-language jobs for one object are collected before a
    # single bundled request is submitted. Plone queues all 26 at once, so the
    # default comfortably covers them.
    ETL_GROUP_WINDOW_MS: "10000"
    # A submission slot is freed when its last language is delivered, but a
    # language can silently never arrive, so this lease is what guarantees
    # slots come back. With failure notifications confirmed working it can drop
    # to 2-3 minutes; keep it high until a sweep proves notifications land.
    ETL_LEASE_MS: "900000"
    # Intake pause after a -11200 QUOTA_EXCEEDED.
    ETL_BREAKER_MS: "30000"
    # Skip languages already translated for byte-identical source HTML.
    ETL_SKIP_CACHE: "true"
  livenessProbe:
    tcpSocket:
      port: http
    periodSeconds: 20
    timeoutSeconds: 3
    initialDelaySeconds: 20
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    tcpSocket:
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

converter:
  enabled: true
  serviceName: converter
  serviceType: ClusterIP
  port: 8000
  image:
    repository: eeacms/eea-volto-blocks-converter
    # v1.0.8 stops /blocks2html returning HTTP 500 for a teaser block whose
    # itemModel has no "@type" (a teaser added but never given a card). One such
    # block aborted the conversion of the whole page, and Plone swallowed the
    # error, so 36 published Climate-ADAPT pages were silently never translated.
    # The partial itemModel round-trips unchanged - no @type is invented.
    tag: "v1.0.8"
    pullPolicy: Always
  resources:
    limits:
      memory: 256Mi
    requests:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

zodbpack:
  enabled: true
  schedule: "0 1 * * *"
  keepSuccessfulPods: 3
  keepFailedPods: 5
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  releaseVersion: ""
  args:
    - /app/bin/zodbpack
    - /app/etc/zodbpack.conf
  resources:
    limits:
      memory: 8Gi
    requests:
      memory: 8Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}

detectBrokenLinks:
  enabled: true
  schedule: "0 3 * * *"
  keepSuccessfulPods: 3
  keepFailedPods: 5
  image:
    repository: curlimages/curl
    tag: "8.8.0"
  authHeaderName: Authentication
  authToken: ""
  resources:
    limits:
      memory: 64Mi
    requests:
      memory: 32Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

debug:
  serviceType: ClusterIP
  serviceName: backend-debug
  enabled: false
  image:
    repository: eeacms/eea.docker.plone-climateadapt
    tag: ""
    pullPolicy: Always
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  environment: {}

entrasync:
  enabled: false
  schedule: "0 0 3 * *"
  keepSuccessfulPods: 3
  keepFailedPods: 5
  releaseVersion: ""
  args:
    - /app/bin/sync_eea_entra
    - --portal
    - cca
    - --zope-conf
    - /app/etc/relstorage.conf
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  environment: {}

postfix:
  fullnameOverride: ""
  dryrun: false
  serverName: climate-adapt.eea.europa.eu
  mtpPass: ""
  mtpPort: ""
  mtpRelay: ""
  mtpUser: ""
  serviceName: "postfix"
  mailtrap:
    httpenabled: false
    serviceType: NodePort
    ingress:
      enabled: false
      hostname: mailtrap-climate-adapt.eea.europa.eu
      annotations:
        cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
      certificate: mailtrap-climate-adapt.eea.europa.eu-tls
