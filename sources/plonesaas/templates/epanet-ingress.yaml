{{- if .Values.epanet.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epanet
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: epanet
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/$ https://www.eea.europa.eu/en/epanet permanent;
      rewrite ^/(.*)$ https://www.eea.europa.eu/en/epanet/$1 permanent;
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- with .Values.epanet.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.epanet.hostname }}
    http:
      paths:
      - backend:
          service:
            name: backend
            port:
              number: 6081
        path: /(.*)
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - {{ .Values.epanet.hostname }}
{{- end }}
