{{- if .Values.ragFactsCheck.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-facts-check
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: rag-facts-check

spec:
  replicas: {{ .Values.ragFactsCheck.replicaCount }}
  selector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: rag-facts-check

  template:
    metadata:
      labels:
        {{- include "appl.selectorLabels" . | nindent 8 }}
        component: rag-facts-check
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "appl.serviceAccountName" . }}
      containers:
      - name: rag-facts-check
        image: "{{ .Values.ragFactsCheck.image.repository }}:{{ .Values.ragFactsCheck.image.tag }}"
        imagePullPolicy: {{ .Values.ragFactsCheck.image.pullPolicy }}
        env:
        - name: TZ
          value: "{{ .Values.timezone }}"
        {{- range $key, $value := .Values.ragFactsCheck.environment }}
        {{- if $value }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}

        ports:
        - containerPort: 8000
          name: http

        {{- if (.Values.ragFactsCheck.livenessProbe) }}
        livenessProbe:
          {{- toYaml .Values.ragFactsCheck.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.ragFactsCheck.startupProbe) }}
        startupProbe:
          {{- toYaml .Values.ragFactsCheck.startupProbe | nindent 10 }}
        {{- end }}

        {{- if (.Values.ragFactsCheck.readinessProbe) }}
        readinessProbe:
          {{- toYaml .Values.ragFactsCheck.readinessProbe | nindent 10 }}
        {{- end }}

        resources:
          {{- toYaml .Values.ragFactsCheck.resources | nindent 10 }}

      {{- with .Values.ragFactsCheck.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ragFactsCheck.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ragFactsCheck.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
{{- end }}
