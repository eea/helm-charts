apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cca-frontend.componentName" (dict "root" . "component" "nginx-config") }}
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: nginx
data:
  upstream.conf: |
    upstream varnish_frontend {
      server {{ .Values.varnish.serviceName }}:{{ .Values.varnish.port }};
    }

    upstream backend_varnish {
      server backend:8080;
    }

    upstream backend_translate {
      server backend-translate:8080;
    }

  default.conf: |
    map $request_uri $frame_options {
      default "SAMEORIGIN";
      ~^/.*embed-chart "";
    }

    server {
      listen 80;
      server_name _;

      access_log /dev/stdout;
      error_log /dev/stderr warn;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_redirect http:// https://;
      proxy_connect_timeout 60s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;

      add_header Strict-Transport-Security "max-age=15768000;" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Expect-CT "max-age=604800, report-uri=\"https://sentry.eea.europa.eu/api/25/security/?sentry_key=36e966c526304fb38680f19ac1927bb5\"" always;
      add_header Server "HTTPS" always;
      add_header X-Xss-Protection "1" always;
      add_header X-Frame-Options $frame_options always;

      location = /decodeFolderFilter {
        deny all;
      }

      # Block traversal to the CMFEditions portal_modifier tool (an OFS
      # OrderedFolder mounted in the portal root). It is reachable through any
      # URL that reaches classic Plone traversal - here that is /_admin/...,
      # which is the only public path that exposes classic Plone; everything
      # else goes to Volto or through the ++api++ REST traverser. Blocking it
      # at the edge is the mitigation recommended on community.plone.org while
      # the fix is prepared upstream; the Traefik/Varnish recipes there are
      # equivalent. Nothing in Climate-ADAPT has a content id, view or query
      # named portal_modifier, so this cannot produce false 403s.
      #
      # nginx matches location regexes against the normalised, percent-decoded
      # URI, so /portal_modifier, /a/b/portal_modifier, //portal_modifier and
      # /portal%5Fmodifier are all caught. Unanchored on purpose - the tool is
      # traversable at any depth. This must stay the FIRST regex location in
      # this server block: nginx evaluates regex locations in order of
      # appearance and stops at the first match, so it has to win over the
      # /_admin, /++api++ and @@... locations below.
      location ~* portal_modifier {
        return 403;
      }

      location ~ ^/@@translate-callback(.*)$ {
        rewrite ^/@@translate-callback(.*)$ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/@@translate-callback$1 break;
        proxy_pass http://backend_translate;
      }

      location ~ ^/@@save-etranslation(.*)$ {
        rewrite ^/@@save-etranslation(.*)$ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/@@save-etranslation$1 break;
        proxy_pass http://backend_translate;
      }

      location ~ ^/@@delete-translation(.*)$ {
        rewrite ^/@@delete-translation(.*)$ /VirtualHostBase/https/$host:443/cca/VirtualHostRoot/@@delete-translation$1 break;
        proxy_pass http://backend_translate;
      }

      location ~ ^/@@call-etranslation(.*)$ {
        rewrite ^/@@call-etranslation(.*)$ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/@@call-etranslation$1 break;
        proxy_pass http://backend_translate;
      }

      location ~ ^/@@sync-translated-paths(.*)$ {
        rewrite ^/@@sync-translated-paths(.*)$ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/@@sync-translated-paths$1 break;
        proxy_pass http://backend_translate;
      }

      location ~ ^/metadata(.*)$ {
        return 301 /en/metadata$1;
      }

      location ~ ^/observatory(.*)$ {
        return 301 /en/observatory$1;
      }

      location ~ ^/mission(.*)$ {
        return 301 /en/mission$1;
      }

      location ~ ^/eu-adaptation-policy(.*)$ {
        return 301 /en/eu-adaptation-policy$1;
      }

      location ~ ^/\+\+api\+\+(.*)$ {
        rewrite ^/\+\+api\+\+(.*)$ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/++api++$1 break;
        proxy_pass http://backend_varnish;
      }

      location ~ ^/_admin/portal_catalog(.*)$ {
        rewrite ^/_admin/portal_catalog(.*)$ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/_vh__admin/portal_catalog$1 break;
        proxy_pass http://backend_varnish;
      }

      location ~ ^/_admin(.*)$ {
        {{- if and .Values.nginx.basicAuth.username .Values.nginx.basicAuth.password }}
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        {{- end }}

        rewrite ^/_admin(.*)$ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/_vh__admin/$1 break;
        proxy_pass http://backend_varnish;
      }

      location ~ ^/admin(.*)$ {
        return 404;
      }

      location = /@@vibriomap-view-simple {
        rewrite ^ /VirtualHostBase/https/$host:443/{{ include "cca-frontend.virtualHostRoot" . }}/VirtualHostRoot/@@vibriomap-view-simple break;
        proxy_pass http://backend_varnish;
      }

      # Serve classic image/download endpoints through Volto. Volto's Express
      # middleware (volto-cca-policy) proxies them to the Plone API with the
      # user's auth_token sent as a Bearer header, so logged-in users can load
      # images of protected content in <img> tags. (Classic Plone URLs never
      # read the auth_token cookie; they only honor __ac or a Bearer header.)
      # The path is passed through unchanged — no VirtualHostBase rewrite.
      location ~ ^/(.*)/@@(images|download)(/.*)?$ {
        proxy_pass http://varnish_frontend;
      }

      location / {
        proxy_pass http://varnish_frontend;
      }
    }
