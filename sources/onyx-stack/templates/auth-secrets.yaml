{{- if hasKey .Values.auth "secretKeys" }}
{{- fail "ERROR: Secrets handling has been refactored under 'auth' and must be updated before upgrading to this chart version." }}
{{- end }}
{{- range $secretKey, $secretContent := .Values.auth }}
{{- if and (empty $secretContent.existingSecret) (or (not (hasKey $secretContent "enabled")) $secretContent.enabled) }}
{{- $secretName := include "onyx.secretName" $secretContent }}
{{- $existingSecret := lookup "v1" "Secret" $.Release.Namespace $secretName }}
{{- $autoGenerate := default (list) $secretContent.autoGenerate }}
{{- /* Pre-validate: fail before emitting YAML if any required value is missing and can't be auto-generated */ -}}
{{- range $name, $value := $secretContent.values }}
{{- $existingVal := "" }}
{{- if and $existingSecret (hasKey $existingSecret.data $name) }}
{{- $existingVal = (index $existingSecret.data $name | b64dec) }}
{{- end }}
{{- if and (empty $value) (empty $existingVal) (not (has $name $autoGenerate)) }}
{{- fail (printf "Secret value for '%s' is required but not set and no existing secret found. Please set auth.%s.values.%s in values.yaml" $name $secretKey $name) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
{{- range $name, $value := $secretContent.values }}
{{- $existingVal := "" }}
{{- if and $existingSecret (hasKey $existingSecret.data $name) }}
{{- $existingVal = (index $existingSecret.data $name | b64dec) }}
{{- end }}
{{- if not (empty $value) }}
  {{ $name }}: {{ $value | quote }}
{{- else if not (empty $existingVal) }}
  {{ $name }}: {{ $existingVal | quote }}
{{- else if has $name $autoGenerate }}
  {{ $name }}: {{ randAlphaNum 40 | sha256sum | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
