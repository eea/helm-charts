{{- if and .Values.vectorDB.enabled (gt (int .Values.celery_worker_scheduled_tasks.replicaCount) 0) (eq (toString (index .Values.configMap "ENABLE_CRAFT" | default "")) "true") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onyx.fullname" . }}-celery-worker-scheduled-tasks
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
    {{- with .Values.celery_worker_scheduled_tasks.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.celery_worker_scheduled_tasks.autoscaling.enabled }}
  replicas: {{ .Values.celery_worker_scheduled_tasks.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "onyx.selectorLabels" . | nindent 6 }}
      {{- if .Values.celery_worker_scheduled_tasks.deploymentLabels }}
      {{- toYaml .Values.celery_worker_scheduled_tasks.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.celery_worker_scheduled_tasks.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "onyx.labels" . | nindent 8 }}
        {{- with .Values.celery_worker_scheduled_tasks.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.celery_worker_scheduled_tasks.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "onyx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.celery_shared.podSecurityContext | nindent 8 }}
      {{- with .Values.celery_worker_scheduled_tasks.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $backendRepo := .Values.global.image.repository }}
      {{- if and .Values.celery_shared.image .Values.celery_shared.image.repository }}
        {{- $backendRepo = .Values.celery_shared.image.repository }}
      {{- end }}
      {{- $backendTag := default .Values.global.image.tags.backend (printf "backend-%s" (default .Chart.AppVersion .Values.global.version)) }}
      {{- if and .Values.celery_shared.image .Values.celery_shared.image.tag }}
        {{- $backendTag = .Values.celery_shared.image.tag }}
      {{- end }}
      {{- with .Values.celery_worker_scheduled_tasks.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery_worker_scheduled_tasks.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $initContainers := include "onyx.hfCache.initContainer" (dict "ctx" . "image" (printf "%s:%s" $backendRepo $backendTag)) }}
      {{- if $initContainers }}
      initContainers:
        {{- $initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: celery-worker-scheduled-tasks
          securityContext:
            {{- toYaml .Values.celery_shared.securityContext | nindent 12 }}
          image: "{{ $backendRepo }}:{{ $backendTag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          {{/* command: (not args:) is required here — unlike the other celery workers,
               this deployment supports customCACerts.commandPrefix (decision: port CA certs
               fully), which needs to wrap the container's entrypoint with
               `update-ca-certificates && exec "$0" "$@"`. That wrapper only works when we
               control the full command, so we don't use the args:-only pattern the other
               workers (e.g. celery-worker-heavy) use. */}}
          command:
            [
              {{- with include "onyx.customCACerts.commandPrefix" . }}
              {{- . | nindent 14 }}
              {{- end }}
              "celery",
              "-A",
              "onyx.background.celery.versioned_apps.scheduled_tasks",
              "worker",
              {{- with .Values.celery_worker_scheduled_tasks.logLevel }}
              {{ printf "--loglevel=%s" . | quote }},
              {{- end }}
              "--hostname=scheduled_tasks@%n",
              "-Q",
              "scheduled_tasks",
            ]
          ports:
            - name: metrics
              containerPort: 9098
              protocol: TCP
          resources:
            {{- toYaml .Values.celery_worker_scheduled_tasks.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.envConfigMapName }}
          env:
            {{- include "onyx.envSecrets" . | nindent 12}}
            {{- /* The scheduled-tasks worker provisions + drives sandboxes headlessly
                   (run_scheduled_task → ensure_sandbox_running), signing push-daemon
                   requests with ONYX_SANDBOX_PUSH_PRIVATE_KEY. With the default
                   sandboxPushSecret.allPods=false, this is only emitted via
                   envSecretsRestricted. Pairs with the scheduled-tasks-worker rule in
                   network-policy-sandbox-push. */}}
            {{- include "onyx.envSecretsRestricted" . | nindent 12}}
            {{- with include "onyx.customCACerts.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.celery_worker_scheduled_tasks.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with include "onyx.volumeMountsWithCA" (dict "ctx" . "volumeMounts" .Values.celery_worker_scheduled_tasks.volumeMounts) }}
          {{- . | nindent 10 }}
          {{- end }}
          startupProbe:
            {{ .Values.celery_shared.startupProbe | toYaml | nindent 12}}
          readinessProbe:
            {{ .Values.celery_shared.readinessProbe | toYaml | nindent 12}}
            exec:
              command:
                - /bin/bash
                - -c
                - >
                    python onyx/background/celery/celery_k8s_probe.py
                    --probe readiness
                    --filename /tmp/onyx_k8s_scheduledtasks_readiness.txt
          livenessProbe:
            {{ .Values.celery_shared.livenessProbe | toYaml | nindent 12}}
            exec:
              command:
                - /bin/bash
                - -c
                - >
                    python onyx/background/celery/celery_k8s_probe.py
                    --probe liveness
                    --filename /tmp/onyx_k8s_scheduledtasks_liveness.txt
      {{- with include "onyx.volumesWithCA" (dict "ctx" . "volumes" .Values.celery_worker_scheduled_tasks.volumes) }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
