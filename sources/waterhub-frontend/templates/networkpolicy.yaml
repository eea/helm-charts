{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-varnish
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: varnish
spec:
  podSelector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: varnish
  policyTypes:
  - Ingress
  ingress:
  - from:
    - {{- toYaml .Values.networkPolicy.ingressController | nindent 6 }}
    ports:
    - port: {{ .Values.varnish.port }}
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-volto
  labels:
    {{- include "appl.labels" . | nindent 4 }}
    component: volto
spec:
  podSelector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: volto
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "appl.selectorLabels" . | nindent 10 }}
          component: varnish
    ports:
    - port: 3000
      protocol: TCP
{{- end }}
