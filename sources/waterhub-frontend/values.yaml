

image:
  repository: eeacms/waterhub-frontend
  pullPolicy: Always
  tag: ""

imagePullSecrets: []

# Credentials are loaded with envFrom into the volto and debug containers from a
# Secret, never written into the pod spec.
# - existingSecret empty: the chart renders "<release>-secrets" from values:
#   the volto.environment keys listed in secretEnvKeys.
# - existingSecret set: that Secret (managed outside the chart) is used instead
#   and must contain the same keys; the values above are then ignored.
existingSecret: ""
secretEnvKeys:
  - SENTRY_AUTH_TOKEN
  - RAZZLE_SENTRY_DSN

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

networkPolicy:
  # Ingress-only NetworkPolicies for varnish and the app pods. Set to false to roll back.
  enabled: true
  # Peer allowed to reach varnish: the cluster ingress controller (RKE2 default).
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        app.kubernetes.io/name: rke2-ingress-nginx

timezone: Europe/Copenhagen


ingress:
  certificate: key-01dev-letsencrypt
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
    nginx.ingress.kubernetes.io/configuration-snippet: |-
      more_set_headers 'Server HTTPS'
        'Strict-Transport-Security max-age=31536000; includeSubDomains; preload'
        'X-Content-Type-Options nosniff'
        'X-Frame-Options SAMEORIGIN'
        'Referrer-Policy strict-origin-when-cross-origin'
        'Permissions-Policy accelerometer=(), autoplay=(), camera=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), sync-xhr=(self), usb=()'
        "Content-Security-Policy-Report-Only default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    nginx.ingress.kubernetes.io/proxy-body-size: 1024m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '480'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '120'
   
ingressredirects:
- enabled: false
  certificate: www.plone.eea.europa.eu-tls
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: 01dev-eea-letsencrypt
  hostname: www.plone.eea.europa.eu    


links:
  backend: backend-varnish.waterhub  # <service>.<namespace> of the waterhub-backend release

    
volto:
  serviceType: ClusterIP
  hostname: plone.eea.europa.eu
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    # targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 60
  replicaCount: 1
  # Image entrypoint already drops to uid 1000; run as it from the start.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 2Gi
  environment:
    SENTRY_URL: 
    SENTRY_AUTH_TOKEN: 
    SENTRY_ORG: 
    SENTRY_PROJECT: 
    RAZZLE_SENTRY_DSN: 
    RAZZLE_BACKEND_NAME: 'waterhub-backend'
    RAZZLE_ALLOWED_CORS_DESTINATIONS: 
    RAZZLE_MATOMO_URL:
    RAZZLE_MATOMO_SITE_ID: 
    RAZZLE_MATOMO_SECOND_SITE_ID:
    RAZZLE_MATOMO_SECOND_TRACKER_URL: 
    RAZZLE_INTERNAL_API_PATH: "http://backend:8080/waterhub"
    RAZZLE_PUBLIC_URL:
    VOLTO_ROBOTSTXT: 
    RAZZLE_DISABLE_DRAFT_WATERMARK: 
    CSP_HEADER: 
  annotations: {}
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 20
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 4
    successThreshold: 2
  
debug:
  addonsPath: /app/src/addons
  affinity: {}
  enabled: false
  environment: {}
  nodeSelector: {}
  podAnnotations: {}
  podSecurityContext: {}
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 3Gi
  securityContext: {}
  serviceType: ClusterIP
  tolerations: []

varnish:
  serviceType: ClusterIP
  serviceName: frontend-varnish
  port: 3000
  backend: "frontend-volto"
  # varnishd master needs root to set up its jail, so no runAsNonRoot / capability drop here.
  securityContext:
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 3Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  environment:
    VARNISH_SIZE: '2G'
    VARNISH_DNS_TTL: '20s'
    VARNISH_DNS_TTL: '20s'
    VARNISH_BERESP_TTL: '60s'
    VARNISH_BERESP_GRACE: '120s'
    VARNISH_BERESP_KEEP: '120s'
    VARNISH_GZIP_ENABLED: 'false'
    AUTOKILL_CRON: ''
  livenessProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
    initialDelaySeconds: 30
    failureThreshold: 5
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /ok
      port: http
    periodSeconds: 5
    timeoutSeconds: 10
    initialDelaySeconds: 10
    failureThreshold: 12
    successThreshold: 1


