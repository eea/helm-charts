{{- if ( default .Values.securityEnabled true) -}}
{{- if .Values.postgres.exposeService.enabled -}}

{{/*
  Any http port needs access to if from ingress or if you want to test it with a Node Port
*/}}


apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres-expose-allow
  labels:
    {{- include "appl.labels" . | nindent 4 }}


spec:
  podSelector:
    matchLabels:
      {{- include "appl.selectorLabels" . | nindent 6 }}
      component: postgres


  policyTypes:
  - Ingress

  ingress:
  - ports:
    - protocol: TCP
      port: 5432




{{- end }}
{{- end }}
